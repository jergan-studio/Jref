<!DOCTYPE html>
<html>
<head>
<title>Jref Home</title>

<style>
:root{
  --bg:#ffffff;
  --text:#000;
  --box:#e6c3d3;
  --panel:#ffffff;
}

body.dark{
  --bg: rgba(20,20,20,0.55);
  --text:#fff;
  --box: rgba(40,40,40,0.6);
  --panel: rgba(30,30,30,0.55);
}

body{
  font-family: Arial;
  text-align:center;
  margin:0;
  background:var(--bg);
  color:var(--text);
  transition:0.2s;
}

body.dark{
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
}

.title{
  font-size:60px;
  margin-top:80px;
}

input{
  padding:10px;
  width:50%;
  border-radius:20px;
  border:none;
  background:var(--box);
  margin:5px;
  outline:none;
}

button{
  margin:5px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:var(--box);
  cursor:pointer;
}

#panel{
  display:none;
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:var(--panel);
  padding:20px;
  border-radius:12px;
  width:320px;
}

#console{
  display:none;
  position:fixed;
  bottom:10px;
  right:10px;
  width:320px;
  height:220px;
  background:rgba(0,0,0,0.85);
  color:lime;
  font-family:monospace;
  font-size:12px;
  padding:10px;
  border-radius:10px;
}

#cmd{
  width:100%;
  background:black;
  color:lime;
  border:none;
}

.shortcutBox{
  display:inline-flex;
  align-items:center;
}

.deleteBtn{
  background:#ff6b6b;
}
</style>
</head>

<body>

<div class="title">Jref</div>

<input id="search" placeholder="Search...">
<br>

<button onclick="location.href='https://youtube.com'">YouTube</button>
<button onclick="location.href='https://github.com'">GitHub</button>

<button onclick="toggleDark()">🌙</button>
<button onclick="togglePanel()">＋ Shortcut</button>
<button onclick="toggleConsole()">🖥</button>

<div id="customButtons"></div>

<!-- PANEL -->
<div id="panel">
<h3>Add Shortcut</h3>
<input id="name" placeholder="name">
<input id="url" placeholder="url">
<br><br>
<button onclick="addShortcut()">Save</button>
<button onclick="togglePanel()">Close</button>
</div>

<!-- CONSOLE -->
<div id="console">
<div id="log"></div>
<input id="cmd" placeholder="cmd...">
</div>

<script>
let saved = JSON.parse(localStorage.getItem("jref_shortcuts") || "{}");

function render(){
  const box = document.getElementById("customButtons");
  box.innerHTML = "";

  Object.keys(saved).forEach(k=>{
    const wrap = document.createElement("div");

    const b = document.createElement("button");
    b.innerText = k;
    b.onclick = ()=> location.href = saved[k];

    const d = document.createElement("button");
    d.innerText = "✕";
    d.onclick = ()=>{
      delete saved[k];
      localStorage.setItem("jref_shortcuts", JSON.stringify(saved));
      render();
    };

    wrap.appendChild(b);
    wrap.appendChild(d);
    box.appendChild(wrap);
  });
}

render();

document.getElementById("search").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    location.href="results.html?q="+encodeURIComponent(e.target.value);
  }
});

function toggleDark(){
  document.body.classList.toggle("dark");
  localStorage.setItem("dark", document.body.classList.contains("dark"));
}
if(localStorage.getItem("dark")==="true") document.body.classList.add("dark");

function togglePanel(){
  const p=document.getElementById("panel");
  p.style.display=p.style.display==="block"?"none":"block";
}

function addShortcut(){
  const n=document.getElementById("name").value;
  const u=document.getElementById("url").value;

  if(!n||!u) return;

  saved[n]=u;
  localStorage.setItem("jref_shortcuts", JSON.stringify(saved));
  render();
}

function toggleConsole(){
  const c=document.getElementById("console");
  c.style.display=c.style.display==="block"?"none":"block";
}
</script>

</body>
</html>
