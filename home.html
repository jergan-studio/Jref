<!DOCTYPE html>
<html>
<head>
<title>Jref</title>

<style>
:root{
  --bg:#ffffff;
  --text:#000;
  --box:#e6c3d3;
  --panel:#ffffff;
}

body.dark{
  --bg: rgba(20,20,20,0.55);
  --text:#fff;
  --box: rgba(40,40,40,0.6);
  --panel: rgba(30,30,30,0.55);
}

body{
  font-family: Arial;
  text-align:center;
  margin:0;
  background:var(--bg);
  color:var(--text);
  transition:0.2s;
}

body.dark{
  backdrop-filter: blur(25px);
}

.title{
  font-size:60px;
  margin-top:80px;
}

input{
  padding:10px;
  width:50%;
  border-radius:20px;
  border:none;
  background:var(--box);
  margin:5px;
  outline:none;
}

button{
  margin:5px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:var(--box);
  cursor:pointer;
}

/* console */
#console{
  display:none;
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:70%;
  height:70%;
  background:var(--panel);
  border-radius:12px;
  overflow:hidden;
  flex-direction:column;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

#consoleHeader{
  padding:10px;
  background:rgba(0,0,0,0.1);
  display:flex;
  justify-content:space-between;
}

#results{
  flex:1;
  overflow:auto;
  padding:10px;
}

.result{
  padding:10px;
  margin:5px 0;
  background:rgba(0,0,0,0.05);
  border-radius:8px;
}

.shortcutBox{
  display:inline-flex;
  align-items:center;
}

.deleteBtn{
  background:#ff6b6b;
}
</style>
</head>

<body>

<div class="title">Jref</div>

<!-- SEARCH -->
<input id="search" placeholder="Search or shortcut (yt, gh, gd)">
<br>

<!-- PRE SHORTCUTS -->
<button onclick="go('yt')">YouTube</button>
<button onclick="go('gh')">GitHub</button>

<!-- TOOLS -->
<button onclick="toggleDark()">🌙</button>
<button onclick="toggleConsole()">🔎 Search Console</button>
<button onclick="openAdd()">＋ Shortcut</button>

<br><br>

<!-- CUSTOM SHORTCUTS -->
<div id="custom"></div>

<!-- ADD SHORTCUT -->
<div id="addBox" style="display:none;">
  <input id="name" placeholder="name">
  <input id="url" placeholder="url">
  <button onclick="add()">Save</button>
</div>

<!-- SEARCH CONSOLE -->
<div id="console">

<div id="consoleHeader">
  <b>Search Console</b>
  <button onclick="closeConsole()">✕</button>
</div>

<div id="results"></div>

</div>

<script>

/* PRE SHORTCUTS */
let shortcuts = {
  yt:"https://youtube.com",
  gh:"https://github.com"
};

/* LOAD SAVED */
let saved = JSON.parse(localStorage.getItem("jref_shortcuts")||"{}");
shortcuts = {...shortcuts,...saved};

/* RENDER SHORTCUTS */
function render(){

  const box = document.getElementById("custom");
  box.innerHTML = "";

  Object.keys(saved).forEach(k=>{

    const wrap = document.createElement("div");

    const b = document.createElement("button");
    b.innerText = k;
    b.onclick = ()=>location.href=saved[k];

    const d = document.createElement("button");
    d.innerText = "✕";
    d.className="deleteBtn";

    d.onclick = ()=>{
      delete saved[k];
      localStorage.setItem("jref_shortcuts",JSON.stringify(saved));
      render();
    };

    wrap.appendChild(b);
    wrap.appendChild(d);
    box.appendChild(wrap);
  });
}
render();

/* PRE SHORTCUT GO */
function go(k){
  location.href = shortcuts[k];
}

/* DARK */
function toggleDark(){
  document.body.classList.toggle("dark");
  localStorage.setItem("dark",document.body.classList.contains("dark"));
}
if(localStorage.getItem("dark")==="true")document.body.classList.add("dark");

/* ADD */
function openAdd(){
  const b=document.getElementById("addBox");
  b.style.display=b.style.display==="block"?"none":"block";
}

function add(){
  const n=document.getElementById("name").value;
  const u=document.getElementById("url").value;

  saved[n]=u;
  localStorage.setItem("jref_shortcuts",JSON.stringify(saved));
  render();
}

/* CONSOLE */
function toggleConsole(){
  document.getElementById("console").style.display="flex";
}

function closeConsole(){
  document.getElementById("console").style.display="none";
}

/* SEARCH */
document.getElementById("search").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    runSearch(e.target.value);
    toggleConsole();
  }
});

/* SEARCH ENGINE (console + results) */
function runSearch(q){

  const box = document.getElementById("results");
  box.innerHTML="";

  const all = {...shortcuts,...saved};

  let found = false;

  Object.keys(all).forEach(k=>{
    if(k.includes(q)){

      const div=document.createElement("div");
      div.className="result";

      div.innerHTML=`
        <b>${k}</b><br>
        <a href="${all[k]}" target="_blank">${all[k]}</a>
      `;

      box.appendChild(div);
      found=true;
    }
  });

  /* fallback search */
  if(!found){
    box.innerHTML+=`
      <div class="result">
        <a target="_blank"
        href="https://www.google.com/search?q=${encodeURIComponent(q)}">
        🔎 Google Search: ${q}
        </a>
      </div>
    `;
  }
}

</script>

</body>
</html>
