<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jref</title>

<style>
:root{
  --bg:#ffffff;
  --text:#000000;
  --box:#e6c3d3;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  text-align:center;
  background:var(--bg);
  color:var(--text);
}

h1{
  margin-top:80px;
  font-size:60px;
}

#search{
  width:50%;
  padding:12px;
  border:none;
  border-radius:20px;
  background:var(--box);
  font-size:16px;
}

button{
  padding:10px 15px;
  margin:5px;
  border:none;
  border-radius:10px;
  background:var(--box);
  cursor:pointer;
  font-size:14px;
}

button:hover{
  opacity:0.9;
}

/* Secret Console */

#console{
  display:none;
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:700px;
  height:450px;
  background:#111;
  color:lime;
  border-radius:10px;
  padding:10px;
  text-align:left;
  font-family:Consolas,monospace;
  box-sizing:border-box;
}

#log{
  height:390px;
  overflow-y:auto;
}

#cmd{
  width:100%;
  padding:8px;
  box-sizing:border-box;
  background:#000;
  color:lime;
  border:none;
}
</style>
</head>
<body>

<h1>Jref</h1>

<input
id="search"
placeholder="Search..."
>

<br><br>

<!-- Preset Shortcuts -->

<button onclick="openShortcut('yt')">
YouTube
</button>

<button onclick="openShortcut('gh')">
GitHub
</button>

<button onclick="openShortcut('giz')">
Gizno AI
</button>

<script>

/* DATABASE */

let db =
JSON.parse(
localStorage.getItem("jref_db") || "{}"
);

/* PRESETS */

if(!db.yt){
  db.yt = "https://youtube.com";
}

if(!db.gh){
  db.gh = "https://github.com";
}

if(!db.giz){
  db.giz = "https://gizno-ai.vercel.app/";
}

if(!db.gizno){
  db.gizno = db.giz;
}

if(!db["gizno ai"]){
  db["gizno ai"] = db.giz;
}

localStorage.setItem(
  "jref_db",
  JSON.stringify(db)
);

/* SEARCH */

document
.getElementById("search")
.addEventListener("keydown",e=>{

  if(e.key==="Enter"){

    const q =
    e.target.value.trim();

    if(!q) return;

    location.href =
    "results.html?q=" +
    encodeURIComponent(q);

  }

});

/* OPEN SHORTCUT */

function openShortcut(key){

  if(db[key]){
    location.href = db[key];
  }

}

/* CREATE SECRET CONSOLE */

const consoleBox =
document.createElement("div");

consoleBox.id = "console";

consoleBox.innerHTML = `
<div id="log"></div>
<input
id="cmd"
placeholder="list | add name url | del name">
`;

document.body.appendChild(consoleBox);

/* TOGGLE */

function toggleConsole(){

  const c =
  document.getElementById("console");

  c.style.display =
  c.style.display === "block"
  ? "none"
  : "block";
}

/* LOG */

function log(msg){

  const box =
  document.getElementById("log");

  box.innerHTML +=
  "> " + msg + "<br>";

  box.scrollTop =
  box.scrollHeight;
}

/* SECRET SHORTCUT
   Shift + Numpad8 + J
*/

let keypad8Held = false;

document.addEventListener(
"keydown",
e=>{

  if(e.code==="Numpad8"){
    keypad8Held = true;
  }

  if(
    e.shiftKey &&
    keypad8Held &&
    e.key.toLowerCase()==="j"
  ){
    toggleConsole();
  }

});

document.addEventListener(
"keyup",
e=>{

  if(e.code==="Numpad8"){
    keypad8Held = false;
  }

});

/* COMMAND INPUT */

document.addEventListener(
"keydown",
e=>{

  if(
    e.target.id==="cmd" &&
    e.key==="Enter"
  ){

    const cmd =
    e.target.value.trim();

    e.target.value = "";

    handleCommand(cmd);

  }

});

/* COMMANDS */

function handleCommand(cmd){

  log(cmd);

  /* LIST */

  if(cmd==="list"){

    Object.keys(db)
    .sort()
    .forEach(key=>{

      log(
        key +
        " → " +
        db[key]
      );

    });

    return;
  }

  /* DELETE */

  if(cmd.startsWith("del ")){

    const key =
    cmd.substring(4).trim();

    if(!db[key]){

      log(
        "Not found: " +
        key
      );

      return;
    }

    delete db[key];

    localStorage.setItem(
      "jref_db",
      JSON.stringify(db)
    );

    log(
      "Deleted: " +
      key
    );

    return;
  }

  /* ADD */

  if(cmd.startsWith("add ")){

    const parts =
    cmd.split(" ");

    const key =
    parts[1];

    const url =
    parts.slice(2).join(" ");

    if(!key || !url){

      log(
        "Usage: add name url"
      );

      return;
    }

    let seconds = 10;

    log(
      "Adding " +
      key +
      "..."
    );

    const timer =
    setInterval(()=>{

      log(
        "⏳ " +
        seconds +
        "s remaining"
      );

      seconds--;

      if(seconds < 0){

        clearInterval(timer);

        db[key] = url;

        localStorage.setItem(
          "jref_db",
          JSON.stringify(db)
        );

        log(
          "✅ Added " +
          key
        );

      }

    },1000);

    return;
  }

  log(
    "Unknown command"
  );
}

</script>

</body>
</html>
