<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jref</title>

<style>
body{
  margin:0;
  font-family:Arial;
  text-align:center;
  background:#fff;
  color:#000;
}

h1{
  margin-top:70px;
  font-size:60px;
}

input{
  width:50%;
  padding:12px;
  border:none;
  border-radius:20px;
  background:#e6c3d3;
  outline:none;
}

button{
  margin:5px;
  padding:10px 15px;
  border:none;
  border-radius:10px;
  background:#e6c3d3;
  cursor:pointer;
}

/* CONSOLE */
#console{
  display:none;
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:700px;
  height:450px;
  background:#111;
  color:lime;
  font-family:monospace;
  text-align:left;
  border-radius:10px;
  padding:10px;
  box-sizing:border-box;
}

#log{
  height:390px;
  overflow:auto;
}

#cmd{
  width:100%;
  padding:8px;
  background:#000;
  color:lime;
  border:none;
  outline:none;
}
</style>
</head>

<body>

<h1>Jref</h1>

<input id="search" placeholder="Search...">
<br><br>

<button onclick="openShortcut('yt')">YouTube</button>
<button onclick="openShortcut('gh')">GitHub</button>
<button onclick="openShortcut('giz')">Gizno AI</button>

<script>

/* DATABASE */
let db = JSON.parse(localStorage.getItem("jref_db") || "{}");

/* PRESETS */
if(!db.yt) db.yt = "https://youtube.com";
if(!db.gh) db.gh = "https://github.com";
if(!db.giz) db.giz = "https://gizno-ai.vercel.app/";

localStorage.setItem("jref_db", JSON.stringify(db));

/* SEARCH */
document.getElementById("search").addEventListener("keydown", e => {
  if(e.key === "Enter"){
    const q = e.target.value.trim();
    if(!q) return;

    location.href = "results.html?q=" + encodeURIComponent(q);
  }
});

/* SHORTCUT OPEN */
function openShortcut(key){
  if(db[key]) location.href = db[key];
}

/* CONSOLE */
const consoleBox = document.createElement("div");
consoleBox.id = "console";

consoleBox.innerHTML = `
<div id="log"></div>
<input id="cmd" placeholder="list | add name url | del name">
`;

document.body.appendChild(consoleBox);

function toggleConsole(){
  const c = document.getElementById("console");
  c.style.display = (c.style.display === "block") ? "none" : "block";
}

function log(msg){
  const box = document.getElementById("log");
  box.innerHTML += "> " + msg + "<br>";
  box.scrollTop = box.scrollHeight;
}

/* CTRL + ` TO OPEN CONSOLE */
document.addEventListener("keydown", e => {
  if(e.ctrlKey && (e.key === "`" || e.key === "~")){
    e.preventDefault();
    toggleConsole();
  }
});

/* COMMAND INPUT */
document.addEventListener("keydown", e => {
  if(e.target.id === "cmd" && e.key === "Enter"){
    const cmd = e.target.value.trim();
    e.target.value = "";
    handle(cmd);
  }
});

function handle(cmd){

  log(cmd);

  /* LIST */
  if(cmd === "list"){
    Object.keys(db).forEach(k => {
      log(k + " → " + db[k]);
    });
    return;
  }

  /* DELETE */
  if(cmd.startsWith("del ")){
    const key = cmd.split(" ")[1];

    delete db[key];

    localStorage.setItem("jref_db", JSON.stringify(db));

    log("Deleted: " + key);
    return;
  }

  /* ADD (10 SEC TIMER) */
  if(cmd.startsWith("add ")){

    const parts = cmd.split(" ");
    const key = parts[1];
    const url = parts.slice(2).join(" ");

    if(!key || !url){
      log("Usage: add name url");
      return;
    }

    let t = 10;

    log("Adding " + key + " in 10 seconds...");

    const timer = setInterval(() => {

      log("⏳ " + t + "s");

      t--;

      if(t < 0){
        clearInterval(timer);

        db[key] = url;

        localStorage.setItem(
          "jref_db",
          JSON.stringify(db)
        );

        log("✅ Added: " + key);
      }

    },1000);

    return;
  }

  log("Unknown command");
}

</script>

</body>
</html>
