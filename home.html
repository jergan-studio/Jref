<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jref</title>
<style>
body{margin:0;font-family:Arial,sans-serif;text-align:center;background:#fff;color:#111}.top{display:flex;justify-content:flex-end;padding:16px 20px}#account{padding:10px 16px;border:0;border-radius:20px;background:#e6c3d3;cursor:pointer}main{padding:30px 20px}h1{margin-top:20px;font-size:60px}.searchbar{display:flex;justify-content:center;gap:8px;max-width:800px;margin:auto}input{flex:1;padding:14px 18px;border:1px solid #ddd;border-radius:24px;font-size:16px}button{padding:10px 15px;border:0;border-radius:10px;background:#e6c3d3;cursor:pointer}.engines{margin-top:14px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.google{background:#f2f2f2}.shortcuts{margin-top:25px}#accountInfo{margin-top:12px;font-size:14px}.note{font-size:13px;color:#666;margin-top:15px}
</style></head>
<body>
<div class="top"><button id="account" onclick="jerganLogin()">🔐 Login with Jergan</button></div>
<main><h1>Jref</h1><div id="accountInfo"></div>
<div class="searchbar"><input id="search" placeholder="Search the web with DuckDuckGo..." autocomplete="off"><button onclick="duckSearch()">🔍 Search</button></div>
<div class="engines"><button onclick="duckSearch()">🦆 DuckDuckGo</button><button class="google" onclick="googleSearch()">🌐 Google</button></div>
<div class="shortcuts"><button onclick="openShortcut('yt')">YouTube</button><button onclick="openShortcut('gh')">GitHub</button><button onclick="openShortcut('giz')">Gizno AI</button></div>
<p class="note">Jref uses DuckDuckGo for its built-in search. Google opens as a separate search.</p>
</main>
<script>
const DB_URL="https://raw.githubusercontent.com/YOURNAME/YOURREPO/main/jref-db.json";let db={yt:"https://youtube.com",gh:"https://github.com",giz:"https://gizno-ai.vercel.app/"};
async function loadDB(){try{const r=await fetch(DB_URL);if(r.ok)db={...db,...await r.json()}}catch(e){}}loadDB();
function duckSearch(){const q=document.getElementById('search').value.trim();if(!q)return;location.href='results.html?q='+encodeURIComponent(q)}
function googleSearch(){const q=document.getElementById('search').value.trim();location.href='https://www.google.com/search?q='+encodeURIComponent(q)}
document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')duckSearch()});function openShortcut(k){if(db[k])location.href=db[k]}
function jerganLogin(){const returnTo=encodeURIComponent('https://jref-theta.vercel.app/home.html');location.href='https://jerganstudio.vercel.app/signin.html?site=jref&return_to='+returnTo}
function showAccount(){try{const token=localStorage.getItem('jergan_token');if(token){document.getElementById('account').textContent='👤 Jergan Account';document.getElementById('accountInfo').textContent='Signed in with Jergan';}}catch(e){}}showAccount();
</script></body></html>
