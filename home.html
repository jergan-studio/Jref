<!DOCTYPE html>
<html>
<head>
<title>Jref Home</title>

<style>
:root{
  --bg:#ffffff;
  --text:#000;
  --box:#e6c3d3;
}

body.dark{
  --bg: rgba(20,20,20,0.6);
  --text:#fff;
  --box: rgba(40,40,40,0.6);
}

body{
  font-family: Arial;
  text-align:center;
  margin:0;
  background:var(--bg);
  color:var(--text);
}

input{
  padding:10px;
  width:50%;
  border-radius:20px;
  border:none;
  background:var(--box);
}

button{
  margin:5px;
  padding:10px;
  border:none;
  border-radius:10px;
  background:var(--box);
  cursor:pointer;
}

/* SECRET CONSOLE */
#console{
  display:none;
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:600px;
  height:400px;
  background:rgba(0,0,0,0.9);
  color:lime;
  font-family:monospace;
  padding:10px;
  border-radius:10px;
}

#log{
  height:330px;
  overflow:auto;
}

#cmd{
  width:100%;
  background:black;
  color:lime;
  border:none;
}
</style>
</head>

<body>

<h1>Jref</h1>

<input id="search" placeholder="Search...">
<br>

<button onclick="go('yt')">YouTube</button>
<button onclick="go('gh')">GitHub</button>

<!-- SECRET CONSOLE -->
<div id="console">
<div id="log"></div>
<input id="cmd" placeholder="command...">
</div>

<script>

/* DATABASE */
let db = JSON.parse(localStorage.getItem("jref_db") || "{}");

/* PRESETS */
db["yt"] = "https://youtube.com";
db["gh"] = "https://github.com";

/* SEARCH → RESULTS.HTML */
document.getElementById("search").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    location.href="results.html?q="+encodeURIComponent(e.target.value);
  }
});

/* SHORTCUT OPEN */
function go(k){
  if(db[k]) location.href = db[k];
}

/* SECRET OPEN */
document.addEventListener("keydown",e=>{
  if(e.shiftKey && e.ctrlKey && e.key.toLowerCase()==="j"){
    toggleConsole();
  }
});

function toggleConsole(){
  const c=document.getElementById("console");
  c.style.display=c.style.display==="block"?"none":"block";
}

function log(msg){
  const l=document.getElementById("log");
  l.innerHTML+="> "+msg+"<br>";
  l.scrollTop=l.scrollHeight;
}

/* COMMAND SYSTEM */
document.getElementById("cmd").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    const cmd=e.target.value.trim();
    e.target.value="";
    handle(cmd);
  }
});

function handle(cmd){

  log(cmd);

  if(cmd==="list"){
    Object.keys(db).forEach(k=>log(k+" → "+db[k]));
    return;
  }

  if(cmd.startsWith("add ")){
    const [,key,url]=cmd.split(" ");

    log("Adding "+key+" (10 min delay)");

    setTimeout(()=>{
      db[key]=url;
      localStorage.setItem("jref_db",JSON.stringify(db));
      log("Added: "+key);
    },600000); // 10 min

    return;
  }

  if(cmd.startsWith("del ")){
    const key=cmd.split(" ")[1];
    delete db[key];
    localStorage.setItem("jref_db",JSON.stringify(db));
    log("Deleted "+key);
    return;
  }

  log("unknown command");
}

</script>

</body>
</html>
