<!DOCTYPE html>
<html>
<head>
<title>Jref</title>

<style>
:root{
  --bg:#ffffff;
  --text:#000;
  --box:#e6c3d3;
  --panel:#ffffff;
}

body.dark{
  --bg: rgba(20,20,20,0.55);
  --text:#fff;
  --box: rgba(40,40,40,0.6);
  --panel: rgba(30,30,30,0.55);
}

body{
  font-family: Arial;
  text-align:center;
  margin:0;
  background:var(--bg);
  color:var(--text);
  transition:0.2s;
}

body.dark{
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
}

.title{
  font-size:60px;
  margin-top:80px;
}

input{
  padding:10px;
  width:50%;
  border-radius:20px;
  border:none;
  background:var(--box);
  margin:5px;
  outline:none;
}

button{
  margin:5px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:var(--box);
  cursor:pointer;
}

/* ===== SEARCH CONSOLE ===== */
#searchConsole{
  display:none;
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:70%;
  height:70%;
  background:var(--panel);
  border-radius:12px;
  box-shadow:0 10px 40px rgba(0,0,0,0.3);
  overflow:hidden;
  flex-direction:column;
}

#searchHeader{
  padding:10px;
  background:rgba(0,0,0,0.1);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

#results{
  flex:1;
  padding:10px;
  overflow:auto;
}

.result{
  margin:10px 0;
  padding:10px;
  border-radius:8px;
  background:rgba(0,0,0,0.05);
}

iframe{
  width:100%;
  height:100%;
  border:none;
}
</style>
</head>

<body>

<div class="title">Jref</div>

<input id="search" placeholder="Search anything...">
<br>

<button onclick="toggleDark()">🌙</button>
<button onclick="openConsole()">🔍 Search Console</button>

<!-- SEARCH CONSOLE -->
<div id="searchConsole">

<div id="searchHeader">
  <b>Search Console</b>
  <button onclick="closeConsole()">✕</button>
</div>

<div id="results"></div>

</div>

<script>

/* ===== DARK MODE ===== */
function toggleDark(){
  document.body.classList.toggle("dark");
  localStorage.setItem("dark",
    document.body.classList.contains("dark")
  );
}
if(localStorage.getItem("dark")==="true"){
  document.body.classList.add("dark");
}

/* ===== OPEN CONSOLE ===== */
function openConsole(){
  document.getElementById("searchConsole").style.display="flex";
}

/* ===== CLOSE CONSOLE ===== */
function closeConsole(){
  document.getElementById("searchConsole").style.display="none";
}

/* ===== SEARCH ===== */
document.getElementById("search").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    runSearch(e.target.value);
    openConsole();
  }
});

function runSearch(q){

  const box = document.getElementById("results");
  box.innerHTML = "";

  /* GOOGLE */
  const g = document.createElement("div");
  g.className="result";
  g.innerHTML = `
    <a href="https://www.google.com/search?q=${encodeURIComponent(q)}" target="_blank">
      🔎 Google Search: ${q}
    </a>
  `;

  /* YOUTUBE */
  const y = document.createElement("div");
  y.className="result";
  y.innerHTML = `
    <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(q)}" target="_blank">
      ▶ YouTube Search: ${q}
    </a>
  `;

  /* BING */
  const b = document.createElement("div");
  b.className="result";
  b.innerHTML = `
    <a href="https://www.bing.com/search?q=${encodeURIComponent(q)}" target="_blank">
      🌐 Bing Search: ${q}
    </a>
  `;

  box.appendChild(g);
  box.appendChild(y);
  box.appendChild(b);
}

</script>

</body>
</html>
