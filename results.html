<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JREF Results</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:white;
}

/* AI TOP BAR */
.aiBox{
  background:#121826;
  border-bottom:1px solid #3b82f6;
  padding:12px;
}

.aiTitle{
  font-weight:bold;
  color:#60a5fa;
}

.aiText{
  font-size:13px;
  opacity:0.9;
}

/* SEARCH BAR */
header{
  padding:10px;
  background:#0f0f0f;
  display:flex;
}

header input{
  flex:1;
  padding:10px;
  border:none;
  border-radius:999px;
  outline:none;
}

/* RESULTS */
#results{
  padding:12px;
}

.result{
  display:block;
  background:#141414;
  border:1px solid #2a2a2a;
  border-radius:14px;
  padding:14px;
  margin-bottom:10px;
  cursor:pointer;
  transition:0.2s;
}

.result:hover{
  background:#1f1f1f;
  border-color:#3b82f6;
}

.title{font-weight:bold;}
.desc{font-size:12px;opacity:0.7;margin-top:5px;}
.link{font-size:11px;color:#60a5fa;margin-top:6px;word-break:break-all;}
</style>
</head>

<body>

<div class="aiBox">
  <div class="aiTitle">🧠 JREF AI</div>
  <div class="aiText" id="aiText">Ready for search...</div>
</div>

<header>
  <input id="searchBox" placeholder="Search JREF...">
</header>

<div id="results"></div>

<script>
const searchBox = document.getElementById("searchBox");
const resultsDiv = document.getElementById("results");
const aiText = document.getElementById("aiText");

const params = new URLSearchParams(location.search);
const initialQuery = params.get("q") || "";

function updateAI(q){
  aiText.innerHTML = q
    ? `Searching: <b>${q}</b>`
    : "Ready for search...";
}

function go(url){
  location.href = url; // SAME TAB FIX
}

function addResult(title, desc, url){
  const div = document.createElement("div");
  div.className = "result";

  div.innerHTML = `
    <div class="title">${title}</div>
    <div class="desc">${desc || ""}</div>
    <div class="link">${url}</div>
  `;

  div.onclick = () => go(url);
  resultsDiv.appendChild(div);
}

function runSearch(q){
  resultsDiv.innerHTML = "";
  updateAI(q);

  addResult("🧠 JREF AI","AI Preview",
    "https://jref-ai.vercel.app/?q=" + encodeURIComponent(q));

  addResult("🔎 Google","Search",
    "https://www.google.com/search?q=" + encodeURIComponent(q));

  addResult("🅱️ Bing","Search",
    "https://www.bing.com/search?q=" + encodeURIComponent(q));

  addResult("🦆 DuckDuckGo","Search",
    "https://duckduckgo.com/?q=" + encodeURIComponent(q));

  const clean = q.toLowerCase().replace(/[^a-z0-9]/g,"");

  addResult("🌐 " + clean + ".com","Generated","https://" + clean + ".com");
  addResult("🌐 " + clean + ".org","Generated","https://" + clean + ".org");
  addResult("🌐 " + clean + ".net","Generated","https://" + clean + ".net");
}

searchBox.addEventListener("keydown", e=>{
  if(e.key === "Enter"){
    runSearch(searchBox.value.trim());
  }
});

searchBox.value = initialQuery;
if(initialQuery) runSearch(initialQuery);
</script>

</body>
</html>
