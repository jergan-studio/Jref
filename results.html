<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JREF Multi Engine Search</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:white;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* AI BAR */
.aiBox{
  background:#121826;
  border-bottom:1px solid #3b82f6;
  padding:12px;
  box-shadow:0 0 15px rgba(59,130,246,0.4);
}

.aiTitle{
  font-weight:bold;
  color:#60a5fa;
}

.aiText{
  font-size:13px;
  opacity:0.9;
}

/* SEARCH */
header{
  display:flex;
  gap:10px;
  padding:12px;
  background:#0f0f0f;
  border-bottom:1px solid #1f1f1f;
}

header input{
  flex:1;
  background:#181818;
  border:none;
  outline:none;
  color:white;
  padding:12px 16px;
  border-radius:999px;
}

header button{
  background:#3b82f6;
  border:none;
  color:white;
  border-radius:999px;
  padding:0 16px;
  cursor:pointer;
}

/* LAYOUT */
.container{
  flex:1;
  display:flex;
  overflow:hidden;
}

.left{
  width:40%;
  overflow-y:auto;
  padding:10px;
  border-right:1px solid #1f1f1f;
}

.right{
  width:60%;
  background:black;
}

iframe{
  width:100%;
  height:100%;
  border:none;
}

/* RESULT BUTTONS */
.result{
  width:100%;
  display:block;
  background:#151515;
  border:1px solid #222;
  border-radius:14px;
  padding:14px;
  margin-bottom:10px;
  text-align:left;
  color:white;
  cursor:pointer;
  transition:0.2s;
  text-decoration:none;
}

.result:hover{
  background:#202020;
  border-color:#3b82f6;
  transform:scale(1.01);
}

.title{
  font-weight:bold;
  font-size:15px;
}

.desc{
  font-size:12px;
  opacity:0.7;
  margin-top:5px;
}

.link{
  font-size:11px;
  color:#60a5fa;
  margin-top:8px;
  word-break:break-all;
}
</style>
</head>

<body>

<!-- AI -->
<div class="aiBox">
  <div class="aiTitle">🧠 JREF AI</div>
  <div class="aiText" id="aiText">Ready for multi-engine instant search...</div>
</div>

<!-- SEARCH -->
<header>
  <input id="searchBox" placeholder="Search JREF...">
  <button onclick="openCom()">.com</button>
</header>

<!-- MAIN -->
<div class="container">

  <div class="left" id="results"></div>

  <div class="right">
    <iframe id="viewer" src="https://jref-ai.vercel.app/"></iframe>
  </div>

</div>

<script>
const searchBox = document.getElementById("searchBox");
const resultsDiv = document.getElementById("results");
const viewer = document.getElementById("viewer");
const aiText = document.getElementById("aiText");

let timeout;

/* AI TEXT */
function updateAI(q){
  aiText.innerHTML = q
    ? `Searching: <b>${q}</b>`
    : "Ready for multi-engine instant search...";
}

/* OPEN JREF WINDOW */
function openNewWindow(url){
  window.open(url, "_blank", "width=1353,height=761");
}

/* IFRAME VIEW */
function openSite(url){
  viewer.src = url;
}

/* RESULT BUILDER */
function addResult(title, desc, url){

  // JREF AI stays iframe button
  if(title.includes("JREF AI")){

    const btn = document.createElement("button");
    btn.className = "result";

    btn.innerHTML = `
      <div class="title">${title}</div>
      <div class="desc">${desc}</div>
      <div class="link">${url}</div>
    `;

    btn.onclick = () => openSite(url);
    resultsDiv.appendChild(btn);
    return;
  }

  // NORMAL RESULTS = NEW WINDOW LINKS
  const a = document.createElement("a");
  a.className = "result";
  a.href = "#";

  a.innerHTML = `
    <div class="title">${title}</div>
    <div class="desc">${desc || ""}</div>
    <div class="link">${url}</div>
  `;

  a.onclick = (e) => {
    e.preventDefault();
    openNewWindow(url);
  };

  resultsDiv.appendChild(a);
}

/* DOMAINS */
function makeDomains(q){
  const clean = q.toLowerCase().replace(/[^a-z0-9]/g,"");

  return [
    clean + ".com",
    clean + ".org",
    clean + ".net",
    clean + ".ai",
    clean + ".fun"
  ];
}

/* SEARCH ENGINE */
async function runSearch(q){

  resultsDiv.innerHTML = "";
  if(!q) return;

  updateAI(q);

  /* JREF AI */
  addResult(
    "🧠 JREF AI",
    "AI preview result",
    "https://jref-ai.vercel.app/?q=" + encodeURIComponent(q)
  );

  /* GOOGLE */
  addResult(
    "🔎 Google",
    "Search Google results",
    "https://www.google.com/search?q=" + encodeURIComponent(q)
  );

  /* BING */
  addResult(
    "🅱️ Bing",
    "Search Bing results",
    "https://www.bing.com/search?q=" + encodeURIComponent(q)
  );

  /* DUCKDUCKGO */
  addResult(
    "🦆 DuckDuckGo",
    "Search DuckDuckGo results",
    "https://duckduckgo.com/?q=" + encodeURIComponent(q)
  );

  /* MIT */
  addResult(
    "🎓 " + q + ".mit.edu",
    "Generated academic domain",
    "https://" + q.replace(/\s+/g,"").toLowerCase() + ".mit.edu"
  );

  /* VERCEL */
  addResult(
    "▲ " + q + ".vercel.app",
    "Generated deployment domain",
    "https://" + q.replace(/\s+/g,"").toLowerCase() + ".vercel.app"
  );

  /* EXTRA DOMAINS */
  makeDomains(q).forEach(d => {
    addResult(
      "🌐 " + d,
      "Generated domain",
      "https://" + d
    );
  });

  /* DUCKDUCKGO API RESULTS */
  try{

    const res = await fetch(
      `https://api.duckduckgo.com/?q=${encodeURIComponent(q)}&format=json&no_html=1&skip_disambig=1`
    );

    const data = await res.json();

    if(data.AbstractURL){
      addResult(
        data.Heading || q,
        data.AbstractText || "Instant answer",
        data.AbstractURL
      );
    }

    if(data.RelatedTopics){
      data.RelatedTopics.slice(0,8).forEach(t => {
        if(t.FirstURL){
          addResult(
            t.Text?.split(" - ")[0] || "Result",
            t.Text || "",
            t.FirstURL
          );
        }
      });
    }

  }catch(e){
    console.log("API failed");
  }

}

/* INSTANT SEARCH */
searchBox.addEventListener("input", () => {
  clearTimeout(timeout);
  const q = searchBox.value.trim();

  timeout = setTimeout(() => {
    runSearch(q);
  }, 200);
});

/* ENTER */
searchBox.addEventListener("keydown", e => {
  if(e.key === "Enter"){
    runSearch(searchBox.value.trim());
  }
});

/* .COM */
function openCom(){
  const q = searchBox.value.trim();
  if(!q) return;

  openNewWindow(
    "https://" + q.replace(/\s+/g,"").toLowerCase() + ".com"
  );
}
</script>

</body>
</html>
