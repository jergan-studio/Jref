<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JREF Instant Search</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:white;
}

/* TOP BAR */
.aiBox{
  background:#121826;
  border-bottom:1px solid #3b82f6;
  padding:12px;
}

.aiTitle{
  font-weight:bold;
  color:#60a5fa;
}

.aiText{
  font-size:13px;
  opacity:0.9;
}

/* SEARCH */
header{
  display:flex;
  gap:10px;
  padding:12px;
  background:#0f0f0f;
  border-bottom:1px solid #1f1f1f;
}

header input{
  flex:1;
  background:#181818;
  border:none;
  outline:none;
  color:white;
  padding:12px 16px;
  border-radius:999px;
}

/* RESULTS */
#results{
  padding:12px;
}

.result{
  width:100%;
  display:block;
  background:#151515;
  border:1px solid #222;
  border-radius:14px;
  padding:14px;
  margin-bottom:10px;
  cursor:pointer;
  text-align:left;
  color:white;
  transition:0.2s;
}

.result:hover{
  background:#202020;
  border-color:#3b82f6;
  transform:scale(1.01);
}

.title{
  font-weight:bold;
  font-size:15px;
}

.desc{
  font-size:12px;
  opacity:0.7;
  margin-top:5px;
}

.link{
  font-size:11px;
  color:#60a5fa;
  margin-top:8px;
  word-break:break-all;
}
</style>
</head>

<body>

<div class="aiBox">
  <div class="aiTitle">🧠 JREF AI</div>
  <div class="aiText" id="aiText">Ready for search...</div>
</div>

<header>
  <input id="searchBox" placeholder="Search JREF...">
</header>

<div id="results"></div>

<script>
const searchBox = document.getElementById("searchBox");
const resultsDiv = document.getElementById("results");
const aiText = document.getElementById("aiText");

let timeout;

/* GET QUERY FROM URL */
const params = new URLSearchParams(location.search);
const initialQuery = params.get("q") || "";

/* AI TEXT */
function updateAI(q){
  aiText.innerHTML = q
    ? `Searching: <b>${q}</b>`
    : "Ready for search...";
}

/* NAVIGATION (SAME TAB) */
function go(url){
  location.href = url;
}

/* RESULT BUILDER */
function addResult(title, desc, url){

  const div = document.createElement("div");
  div.className = "result";

  div.innerHTML = `
    <div class="title">${title}</div>
    <div class="desc">${desc || ""}</div>
    <div class="link">${url}</div>
  `;

  div.onclick = () => {
    go(url); // 🔥 SAME TAB NAVIGATION
  };

  resultsDiv.appendChild(div);
}

/* SEARCH ENGINE */
async function runSearch(q){

  resultsDiv.innerHTML = "";
  if(!q) return;

  updateAI(q);

  /* JREF AI */
  addResult(
    "🧠 JREF AI",
    "AI preview",
    "https://jref-ai.vercel.app/?q=" + encodeURIComponent(q)
  );

  /* GOOGLE */
  addResult(
    "🔎 Google",
    "Search Google",
    "https://www.google.com/search?q=" + encodeURIComponent(q)
  );

  /* BING */
  addResult(
    "🅱️ Bing",
    "Search Bing",
    "https://www.bing.com/search?q=" + encodeURIComponent(q)
  );

  /* DUCKDUCKGO */
  addResult(
    "🦆 DuckDuckGo",
    "Search DuckDuckGo",
    "https://duckduckgo.com/?q=" + encodeURIComponent(q)
  );

  /* MIT */
  addResult(
    "🎓 " + q + ".mit.edu",
    "Generated domain",
    "https://" + q.replace(/\s+/g,"").toLowerCase() + ".mit.edu"
  );

  /* VERCEL */
  addResult(
    "▲ " + q + ".vercel.app",
    "Generated domain",
    "https://" + q.replace(/\s+/g,"").toLowerCase() + ".vercel.app"
  );

  /* OPTIONAL DOMAINS */
  const clean = q.toLowerCase().replace(/[^a-z0-9]/g,"");

  [
    clean + ".com",
    clean + ".org",
    clean + ".net"
  ].forEach(d => {
    addResult("🌐 " + d, "Generated domain", "https://" + d);
  });

}

/* INSTANT SEARCH */
searchBox.addEventListener("input", () => {
  clearTimeout(timeout);
  const q = searchBox.value.trim();

  timeout = setTimeout(() => runSearch(q), 200);
});

/* ENTER */
searchBox.addEventListener("keydown", e => {
  if(e.key === "Enter"){
    runSearch(searchBox.value.trim());
  }
});

/* LOAD FROM URL (?q=hi) */
searchBox.value = initialQuery;
if(initialQuery){
  runSearch(initialQuery);
}
</script>

</body>
</html>
