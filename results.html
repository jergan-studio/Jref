<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JREF Instant Search</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b0b0b;
  color:white;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* AI BAR */
.aiBox{
  background:#121826;
  border-bottom:1px solid #3b82f6;
  padding:12px;
  box-shadow:0 0 15px rgba(59,130,246,0.4);
}

.aiTitle{
  font-weight:bold;
  color:#60a5fa;
  margin-bottom:4px;
}

.aiText{
  font-size:13px;
  opacity:0.9;
}

/* SEARCH */
header{
  display:flex;
  gap:10px;
  padding:12px;
  background:#0f0f0f;
  border-bottom:1px solid #1f1f1f;
}

header input{
  flex:1;
  background:#181818;
  border:none;
  outline:none;
  color:white;
  padding:12px 16px;
  border-radius:999px;
  font-size:15px;
}

header button{
  border:none;
  background:#3b82f6;
  color:white;
  border-radius:999px;
  padding:0 18px;
  cursor:pointer;
  transition:0.2s;
}

header button:hover{
  background:#2563eb;
}

/* MAIN */
.container{
  flex:1;
  display:flex;
  overflow:hidden;
}

/* RESULTS */
.left{
  width:40%;
  overflow-y:auto;
  padding:10px;
  border-right:1px solid #1f1f1f;
}

/* VIEWER */
.right{
  width:60%;
  background:black;
}

iframe{
  width:100%;
  height:100%;
  border:none;
}

/* RESULT STYLE */
.result{
  width:100%;
  display:block;
  background:#151515;
  border:1px solid #222;
  border-radius:14px;
  padding:14px;
  margin-bottom:10px;
  text-align:left;
  color:white;
  cursor:pointer;
  transition:0.2s;
  text-decoration:none;
}

.result:hover{
  background:#202020;
  border-color:#3b82f6;
  transform:scale(1.01);
}

.resultTitle{
  font-size:15px;
  font-weight:bold;
  margin-bottom:5px;
}

.resultDesc{
  font-size:12px;
  opacity:0.7;
  line-height:1.4;
}

.resultLink{
  margin-top:8px;
  font-size:11px;
  color:#60a5fa;
  word-break:break-all;
}

/* SCROLLBAR */
::-webkit-scrollbar{
  width:8px;
}

::-webkit-scrollbar-thumb{
  background:#222;
  border-radius:999px;
}
</style>
</head>

<body>

<!-- AI BAR -->
<div class="aiBox">

  <div class="aiTitle">
    🧠 JREF AI
  </div>

  <div class="aiText" id="aiText">
    Ready for instant search...
  </div>

</div>

<!-- SEARCH -->
<header>

  <input
    id="searchBox"
    placeholder="Search JREF instantly..."
    autocomplete="off"
  >

  <button onclick="openCom()">
    .com
  </button>

</header>

<!-- MAIN -->
<div class="container">

  <!-- RESULTS -->
  <div class="left" id="results"></div>

  <!-- EMBED -->
  <div class="right">
    <iframe
      id="viewer"
      src="https://jref-ai.vercel.app/"
    ></iframe>
  </div>

</div>

<script>
const searchBox = document.getElementById("searchBox");
const resultsDiv = document.getElementById("results");
const viewer = document.getElementById("viewer");
const aiText = document.getElementById("aiText");

let timeout;

/* OPEN SITE IN IFRAME */
function openSite(url){
  viewer.src = url;
}

/* AI TEXT */
function updateAI(query){

  if(!query){

    aiText.innerHTML =
      "Ready for instant search...";

    return;
  }

  aiText.innerHTML = `
    Searching instantly for:
    <b>${query}</b>
  `;
}

/* RESULT CREATOR */
function addResult(title, desc, url){

  /* JREF AI BUTTON */
  if(title.includes("JREF AI")){

    const btn =
      document.createElement("button");

    btn.className = "result";

    btn.innerHTML = `
      <div class="resultTitle">
        ${title}
      </div>

      <div class="resultDesc">
        ${desc || ""}
      </div>

      <div class="resultLink">
        ${url}
      </div>
    `;

    btn.onclick = () => {
      openSite(url);
    };

    resultsDiv.appendChild(btn);

    return;
  }

  /* NORMAL RESULTS = LINKS */
  const link =
    document.createElement("a");

  link.className = "result";
  link.href = url;
  link.target = "_blank";

  link.innerHTML = `
    <div class="resultTitle">
      ${title}
    </div>

    <div class="resultDesc">
      ${desc || ""}
    </div>

    <div class="resultLink">
      ${url}
    </div>
  `;

  resultsDiv.appendChild(link);
}

/* DOMAINS */
function makeDomains(q){

  const clean =
    q.toLowerCase()
     .replace(/[^a-z0-9]/g,"");

  return [
    clean + ".com",
    clean + ".org",
    clean + ".net",
    clean + ".ai",
    clean + ".fun"
  ];
}

/* SEARCH */
async function runSearch(query){

  resultsDiv.innerHTML = "";

  if(!query){
    return;
  }

  updateAI(query);

  /* JREF AI */
  addResult(
    "🧠 JREF AI",
    "AI enhanced search result",
    "https://jref-ai.vercel.app/?q=" +
    encodeURIComponent(query)
  );

  /* SEARCH LINK */
  addResult(
    "🔎 Search on DuckDuckGo",
    "Open external search engine",
    "https://duckduckgo.com/?q=" +
    encodeURIComponent(query)
  );

  /* API */
  try{

    const res = await fetch(
      `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`
    );

    const data = await res.json();

    /* MAIN RESULT */
    if(data.AbstractURL){

      addResult(
        data.Heading || query,
        data.AbstractText || "Instant answer",
        data.AbstractURL
      );

    }

    /* RELATED */
    if(data.RelatedTopics){

      data.RelatedTopics
      .slice(0,8)
      .forEach(item => {

        if(item.FirstURL){

          addResult(
            item.Text?.split(" - ")[0] ||
            "Result",

            item.Text || "Search result",

            item.FirstURL
          );

        }

      });

    }

  }catch(err){

    console.log("Search failed");

  }

  /* DOMAINS */
  makeDomains(query)
  .forEach(domain => {

    addResult(
      "🌐 " + domain,
      "Generated domain suggestion",
      "https://" + domain
    );

  });

}

/* INSTANT SEARCH */
searchBox.addEventListener(
  "input",
  () => {

    clearTimeout(timeout);

    const query =
      searchBox.value.trim();

    timeout = setTimeout(() => {

      runSearch(query);

    },250);

  }
);

/* ENTER */
searchBox.addEventListener(
  "keydown",
  e => {

    if(e.key === "Enter"){

      runSearch(
        searchBox.value.trim()
      );

    }

  }
);

/* .COM */
function openCom(){

  const q =
    searchBox.value.trim();

  if(!q) return;

  openSite(
    "https://" +
    q.replace(/\s+/g,"")
     .toLowerCase() +
    ".com"
  );

}
</script>

</body>
</html>
