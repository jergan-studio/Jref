<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jref Results</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#fff;color:#111}header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid #ddd;position:sticky;top:0;background:#fff;z-index:2}h1{font-size:28px;margin:0}.search{flex:1;max-width:700px;padding:12px 16px;border:1px solid #ddd;border-radius:22px}button{padding:10px 15px;border:0;border-radius:10px;background:#e6c3d3;cursor:pointer}#account{margin-left:auto}.tools{max-width:900px;margin:14px auto 0;padding:0 20px}.google{background:#f2f2f2}#results{max-width:900px;margin:20px auto;padding:0 20px}.result{padding:16px 0;border-bottom:1px solid #eee}.result h2{font-size:20px;margin:0 0 5px}.result a{color:#1261a0;text-decoration:none}.result a:hover{text-decoration:underline}.url{font-size:13px;color:#287a35;word-break:break-all}.snippet{margin-top:7px;line-height:1.5;color:#444}.status{text-align:center;padding:40px;color:#666}.provider{font-size:13px;color:#666;margin-bottom:15px}
</style></head>
<body>
<header><h1>Jref</h1><input id="search" class="search" placeholder="Search the web..." autocomplete="off"><button onclick="search()">Search</button><button id="account" onclick="jerganLogin()">🔐 Jergan</button></header>
<div class="tools"><button class="google" onclick="googleSearch()">🌐 Search with Google</button></div>
<div id="results"><div class="status">Loading DuckDuckGo results...</div></div>
<script>
const query=new URLSearchParams(location.search).get('q')||'';const box=document.getElementById('search');const results=document.getElementById('results');box.value=query;
function search(){const q=box.value.trim();if(q)location.href='results.html?q='+encodeURIComponent(q)}
function googleSearch(){const q=box.value.trim();location.href='https://www.google.com/search?q='+encodeURIComponent(q)}
box.addEventListener('keydown',e=>{if(e.key==='Enter')search()});
function jerganLogin(){const r=encodeURIComponent('https://jref-theta.vercel.app/home.html');location.href='https://jerganstudio.vercel.app/signin.html?site=jref&return_to='+r}function esc(v){const d=document.createElement('div');d.textContent=v||'';return d.innerHTML}
async function run(){if(!query){results.innerHTML='<div class="status">Enter something to search.</div>';return}try{const r=await fetch('/api/search?q='+encodeURIComponent(query));const data=await r.json();if(!r.ok)throw new Error(data.error||'Search failed');
if(!data.results?.length){results.innerHTML='<div class="status"><b>No Instant Answer results were returned.</b><p><a href="'+esc(data.fallback)+'" target="_blank" rel="noopener noreferrer">See full DuckDuckGo results →</a></p></div>';return}
results.innerHTML='<div class="provider">DuckDuckGo results for <b>'+esc(query)+'</b></div>';data.results.forEach(item=>{const div=document.createElement('div');div.className='result';div.innerHTML='<h2><a href="'+esc(item.url)+'" target="_blank" rel="noopener noreferrer">'+esc(item.title)+'</a></h2><div class="url">'+esc(item.url)+'</div><div class="snippet">'+esc(item.snippet)+'</div>';results.appendChild(div)});const more=document.createElement('div');more.className='status';more.innerHTML='<a href="'+esc(data.fallback)+'" target="_blank" rel="noopener noreferrer">See more DuckDuckGo results →</a>';results.appendChild(more)}catch(e){results.innerHTML='<div class="status"><b>Jref search is temporarily unavailable.</b><p>Try again in a moment.</p></div>';console.error(e)}}run();
</script></body></html>
