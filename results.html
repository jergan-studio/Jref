<!DOCTYPE html>
<html>
<head>
<title>JREF Results</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #e9e9e9;
}

/* layout */
.container {
  display: flex;
  height: 100vh;
}

/* left panel (results) */
.left {
  width: 40%;
  overflow-y: auto;
  padding: 15px;
  background: #f5f5f5;
}

/* right panel (embed browser) */
.right {
  width: 60%;
  background: #111;
  display: flex;
  flex-direction: column;
}

/* iframe browser */
iframe {
  flex: 1;
  width: 100%;
  border: none;
  background: white;
}

/* results */
.result {
  background: white;
  margin: 10px 0;
  padding: 12px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.2s;
}

.result:hover {
  transform: scale(1.02);
}

.result a {
  font-size: 18px;
  color: black;
  text-decoration: none;
}

/* top bar */
.topbar {
  padding: 10px;
  background: #222;
  color: white;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border-radius: 8px;
  border: none;
}
</style>
</head>

<body>

<div class="container">

  <!-- LEFT: results -->
  <div class="left">

    <h3 id="title">Results</h3>

    <div id="results">Loading...</div>

  </div>

  <!-- RIGHT: embed browser -->
  <div class="right">

    <div class="topbar">
      🌐 JREF Embed Viewer
      <input id="urlbar" placeholder="Enter URL..." onkeydown="if(event.key==='Enter') loadURL(this.value)">
    </div>

    <iframe id="viewer" src="about:blank"></iframe>

  </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const query = params.get("q");

document.getElementById("title").innerText = "Results for: " + query;

const box = document.getElementById("results");
const viewer = document.getElementById("viewer");

/* -----------------------------
   LOAD WEBSITE IN EMBED PANEL
------------------------------ */
function loadURL(url) {
  if (!url) return;

  if (!url.startsWith("http")) {
    url = "https://" + url;
  }

  viewer.src = url;
}

/* -----------------------------
   DOMAIN GUESSING
------------------------------ */
function guessDomains(q) {
  const clean = q.replace(/[^a-z0-9]/gi, "");
  return [
    clean + ".com",
    clean + ".org",
    clean + ".fun",
    clean + ".ink"
  ];
}

const guesses = guessDomains(query);

/* show quick domain buttons */
guesses.forEach(domain => {
  const div = document.createElement("div");
  div.className = "result";
  div.innerHTML = `<b>${domain}</b>`;
  div.onclick = () => loadURL(domain);
  box.appendChild(div);
});

/* -----------------------------
   DUCKDUCKGO SEARCH
------------------------------ */

fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_redirect=1&no_html=1`)
  .then(res => res.json())
  .then(data => {

    if (data.AbstractText) {
      const div = document.createElement("div");
      div.className = "result";
      div.innerHTML = `<b>${data.Heading}</b><p>${data.AbstractText}</p>`;
      div.onclick = () => loadURL(data.AbstractURL);
      box.appendChild(div);
    }

    if (data.RelatedTopics) {
      data.RelatedTopics.forEach(item => {
        if (item.Text && item.FirstURL) {
          const div = document.createElement("div");
          div.className = "result";
          div.innerHTML = `<b>${item.Text.split(" - ")[0]}</b>`;
          div.onclick = () => loadURL(item.FirstURL);
          box.appendChild(div);
        }
      });
    }

  });

</script>

</body>
</html>
