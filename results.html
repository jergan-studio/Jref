<!DOCTYPE html>
<html>
<head>
<title>Results - Jref</title>

<style>
body {
  font-family: Arial;
  background: #e9e9e9;
  padding: 20px;
}

.result {
  background: white;
  margin: 10px 0;
  padding: 15px;
  border-radius: 10px;
  animation: fadeIn 0.3s ease;
}

a {
  font-size: 20px;
  text-decoration: none;
  color: black;
}

p {
  color: #444;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<h2 id="title"></h2>
<div id="results">Loading...</div>

<script>
const params = new URLSearchParams(window.location.search);
const query = params.get("q");

document.getElementById("title").innerText = "Results for: " + query;

const box = document.getElementById("results");

/* DUCKDUCKGO API SEARCH */
fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_redirect=1&no_html=1`)
  .then(res => res.json())
  .then(data => {

    box.innerHTML = "";

    let hasResults = false;

    // Abstract result (main answer)
    if (data.AbstractText) {
      hasResults = true;
      box.innerHTML += `
        <div class="result">
          <a href="${data.AbstractURL}" target="_blank">${data.Heading || query}</a>
          <p>${data.AbstractText}</p>
        </div>
      `;
    }

    // Related topics (list results)
    if (data.RelatedTopics && data.RelatedTopics.length > 0) {
      data.RelatedTopics.forEach(item => {
        if (item.Text && item.FirstURL) {
          hasResults = true;
          box.innerHTML += `
            <div class="result">
              <a href="${item.FirstURL}" target="_blank">${item.Text.split(" - ")[0]}</a>
              <p>${item.Text}</p>
            </div>
          `;
        }
      });
    }

    // fallback if nothing found
    if (!hasResults) {
      box.innerHTML = `
        <p>No results found. Redirecting to DuckDuckGo...</p>
      `;

      setTimeout(() => {
        window.location.href =
          "https://duckduckgo.com/?q=" + encodeURIComponent(query);
      }, 1200);
    }

  })
  .catch(err => {
    box.innerHTML = "<p>Error loading results.</p>";
    console.error(err);
  });

</script>

</body>
</html>
