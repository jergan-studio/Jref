<!DOCTYPE html>
<html>
<head>
<title>Jref Results</title>

<style>
body{
  font-family:Arial,sans-serif;
  padding:20px;
}

.result{
  border:1px solid #ddd;
  border-radius:10px;
  padding:10px;
  margin:10px 0;
}

a{
  color:#0066cc;
  text-decoration:none;
}

a:hover{
  text-decoration:underline;
}
</style>
</head>

<body>

<h1>Results</h1>

<div id="results"></div>

<script>

const query =
(
  new URLSearchParams(location.search)
).get("q") || "";

const db =
JSON.parse(
  localStorage.getItem("jref_db") || "{}"
);

const container =
document.getElementById("results");

container.innerHTML =
`<p>Searching for: <b>${query}</b></p>`;

/* SIMPLE SIMILARITY */

function similarity(a,b){

  a = a.toLowerCase();
  b = b.toLowerCase();

  let score = 0;

  if(a.includes(b)) score += 5;
  if(b.includes(a)) score += 5;

  for(const ch of b){

    if(a.includes(ch)){
      score++;
    }

  }

  return score;
}

const matches = [];

for(const key in db){

  const score =
    similarity(key, query);

  if(score > 0){

    matches.push({
      key,
      url: db[key],
      score
    });

  }

}

matches.sort(
  (a,b) => b.score - a.score
);

if(matches.length){

  matches.forEach(item => {

    const div =
      document.createElement("div");

    div.className = "result";

    div.innerHTML = `
      <h3>${item.key}</h3>
      <p>Match Score: ${item.score}</p>
      <a href="${item.url}">
        Open
      </a>
    `;

    container.appendChild(div);

  });

}else{

  container.innerHTML += `
    <div class="result">
      <h3>No database results found</h3>
      <a href="https://www.google.com/search?q=${encodeURIComponent(query)}">
        Search Google
      </a>
    </div>
  `;
}

</script>

</body>
</html>
