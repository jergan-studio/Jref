<!DOCTYPE html>
<html>
<head>
<title>JREF Results</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #e9e9e9;
}

.container {
  display: flex;
  height: 100vh;
}

/* LEFT */
.left {
  width: 40%;
  overflow-y: auto;
  padding: 15px;
  background: #f5f5f5;
}

/* RIGHT */
.right {
  width: 60%;
  background: #111;
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
  background: white;
}

/* result card */
.result {
  background: white;
  margin: 10px 0;
  padding: 12px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.2s;
}

.result:hover {
  transform: scale(1.02);
}

a {
  text-decoration: none;
  color: #2563eb;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

  <div class="left">
    <h3 id="title"></h3>
    <div id="results"></div>
  </div>

  <div class="right">
    <iframe id="viewer" src="https://jref-ai.vercel.app/"></iframe>
  </div>

</div>

<script>
const query = new URLSearchParams(window.location.search).get("q") || "";

document.getElementById("title").innerText = "Results for: " + query;

const box = document.getElementById("results");
const viewer = document.getElementById("viewer");

function openSite(url) {
  viewer.src = url;
}

/* -----------------------------
   URL GUESS SYSTEM
------------------------------ */
function generateUrls(q) {
  const clean = q.toLowerCase().replace(/[^a-z0-9]/g, "");

  return [
    { title: clean + ".com", url: "https://" + clean + ".com" },
    { title: clean + ".org", url: "https://" + clean + ".org" },
    { title: clean + ".fun", url: "https://" + clean + ".fun" },
    { title: clean + ".ink", url: "https://" + clean + ".ink" }
  ];
}

/* -----------------------------
   BUILD FAKE + SMART RESULTS
   (STABLE REPLACEMENT FOR DUCKDUCKGO)
------------------------------ */

const results = [
  {
    title: "🔎 Search in JREF AI",
    url: "https://jref-ai.vercel.app/?q=" + encodeURIComponent(query)
  },
  {
    title: "🌐 Open direct search page",
    url: "https://duckduckgo.com/?q=" + encodeURIComponent(query)
  },
  ...generateUrls(query)
];

/* render results */
results.forEach(r => {
  const div = document.createElement("div");
  div.className = "result";

  div.innerHTML = `<a href="#">${r.title}</a>`;

  div.onclick = () => openSite(r.url);

  box.appendChild(div);
});

</script>

</body>
</html>
