<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>JREF Search</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f0f;
    color: white;
}

.topbar {
    display: flex;
    padding: 12px;
    background: #1a1a1a;
}

.topbar input {
    flex: 1;
    padding: 10px;
    border: none;
    outline: none;
    border-radius: 8px;
}

.topbar button {
    margin-left: 10px;
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: #4f7cff;
    color: white;
    cursor: pointer;
}

.container {
    padding: 20px;
    max-width: 900px;
    margin: auto;
}

/* AI BOX ON TOP */
.ai-box {
    background: linear-gradient(135deg, #2b2b2b, #1c1c1c);
    border: 1px solid #333;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 20px;
}

.ai-title {
    font-size: 14px;
    color: #9ad1ff;
    margin-bottom: 8px;
}

/* RESULTS */
.result {
    padding: 12px;
    border-bottom: 1px solid #222;
}

.result a {
    color: #7db3ff;
    font-size: 18px;
    text-decoration: none;
}

.result a:hover {
    text-decoration: underline;
}

.result p {
    font-size: 13px;
    color: #aaa;
}
</style>
</head>

<body>

<div class="topbar">
    <input id="query" placeholder="Search JREF..." />
    <button onclick="search()">Search</button>
</div>

<div class="container">

    <!-- JREF AI (ALWAYS TOP) -->
    <div class="ai-box" id="aiBox">
        <div class="ai-title">JREF AI</div>
        <div id="aiText">Ask something and I’ll respond here above results.</div>
    </div>

    <!-- RESULTS -->
    <div id="results"></div>

</div>

<script>
function search() {
    const q = document.getElementById("query").value;
    const resultsDiv = document.getElementById("results");
    const aiBox = document.getElementById("aiText");

    // ===== AI RESPONSE (mock for now) =====
    aiBox.innerText = generateAI(q);

    // ===== MOCK SEARCH RESULTS =====
    const results = [
        {
            title: q + " - Wikipedia",
            desc: "Information about " + q,
            link: "https://en.wikipedia.org/wiki/" + encodeURIComponent(q)
        },
        {
            title: q + " - Google Search",
            desc: "Search results from Google",
            link: "https://www.google.com/search?q=" + encodeURIComponent(q)
        },
        {
            title: q + " - Bing Search",
            desc: "Search results from Bing",
            link: "https://www.bing.com/search?q=" + encodeURIComponent(q)
        }
    ];

    // render results
    resultsDiv.innerHTML = "";

    results.forEach(r => {
        const div = document.createElement("div");
        div.className = "result";

        div.innerHTML = `
            <a href="${r.link}" target="_self">${r.title}</a>
            <p>${r.desc}</p>
        `;
        resultsDiv.appendChild(div);
    });
}

// SIMPLE AI LOGIC (upgrade later with API)
function generateAI(q) {
    if (!q) return "Type something to get results.";
    
    return "You searched for: \"" + q + "\". " +
           "JREF AI is currently running in basic mode. " +
           "Later you can connect me to an API for real answers.";
}
</script>

</body>
</html>
