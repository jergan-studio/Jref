<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jref — Search</title>
<style>
:root{--bg:#f8f8fa;--card:#fff;--text:#202124;--muted:#6b7280;--line:#e6e6ea;--accent:#e6c3d3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}header{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 26px;position:sticky;top:0;z-index:5}.logo{font-size:25px;font-weight:700;letter-spacing:-1px}.searchWrap{display:flex;flex:1;max-width:760px;background:#f1f2f4;border-radius:24px;padding:4px 6px 4px 18px}.searchWrap:focus-within{background:#fff;border:1px solid #d1d5db;padding:3px 5px 3px 17px}.searchWrap input{flex:1;border:0;outline:0;background:transparent;font-size:16px}.searchWrap button,.account{border:0;border-radius:20px;padding:9px 16px;cursor:pointer}.searchWrap button{background:var(--accent)}.account{margin-left:auto;background:#fff;border:1px solid #ddd}.bar{max-width:900px;margin:20px auto 0;padding:0 24px;color:var(--muted);font-size:13px}.results{max-width:900px;margin:5px auto;padding:0 24px 50px}.result{background:var(--card);margin:12px 0;padding:18px 20px;border:1px solid var(--line);border-radius:12px}.result:hover{box-shadow:0 3px 12px #0000000b}.result h2{font-size:19px;margin:0 0 5px}.result h2 a{color:#2457a6;text-decoration:none}.result h2 a:hover{text-decoration:underline}.favicon{width:16px;height:16px;vertical-align:-3px;margin-right:7px;border-radius:3px}.url{font-size:13px;color:#4f7d43;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.snippet{margin-top:8px;line-height:1.5;color:#4b5563}.status{text-align:center;padding:55px 20px;color:var(--muted)}.status button{border:0;background:var(--accent);padding:10px 16px;border-radius:20px;cursor:pointer}.status a,.more a{color:#2457a6}.more{text-align:center;margin:25px}
</style>
</head>
<body>
<header><div class="logo">Jref</div><div class="searchWrap"><input id="searchBox" placeholder="Search the web..." autocomplete="off"><button id="searchBtn">Search</button></div><button class="account" id="accountBtn">🔐 Jergan</button></header>
<div class="bar" id="bar"></div><main class="results" id="results"><div class="status">Searching...</div></main>
<script>
const query=new URLSearchParams(location.search).get('q')||'';const box=document.getElementById('searchBox'),out=document.getElementById('results');box.value=query;
function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}function search(){const q=box.value.trim();if(q)location.href='results.html?q='+encodeURIComponent(q)}document.getElementById('searchBtn').onclick=search;box.addEventListener('keydown',e=>{if(e.key==='Enter')search()});document.getElementById('accountBtn').onclick=()=>location.href='https://jerganstudio.vercel.app/signin.html?site=jref&return_to='+encodeURIComponent(location.href);
function addResult(title,desc,url){try{new URL(url)}catch{return}const div=document.createElement('article');div.className='result';const origin=new URL(url).origin;div.innerHTML='<h2><img class="favicon" src="'+esc(origin+'/favicon.ico')+'" onerror="this.style.display=\'none\'"><a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+esc(title||'Untitled result')+'</a></h2><div class="url">'+esc(url)+'</div><div class="snippet">'+esc(desc||'')+'</div>';out.appendChild(div)}
async function run(){if(!query){out.innerHTML='<div class="status">Enter a search above.</div>';return}document.getElementById('bar').textContent='Search results for “'+query+'”';out.innerHTML='<div class="status">Searching...</div>';try{const res=await fetch('https://api.duckduckgo.com/?q='+encodeURIComponent(query)+'&format=json&no_html=1&skip_disambig=1');if(!res.ok)throw new Error('DuckDuckGo returned HTTP '+res.status);const data=await res.json();out.innerHTML='';let count=0;if(data.AbstractURL){addResult(data.Heading||query,data.AbstractText||'Instant answer',data.AbstractURL);count++}const topics=Array.isArray(data.RelatedTopics)?data.RelatedTopics:[];function topic(t){if(t?.FirstURL){addResult((t.Text||'Result').split(' - ')[0],t.Text||'',t.FirstURL);count++}if(Array.isArray(t?.Topics))t.Topics.forEach(topic)}topics.forEach(topic);if(!count){out.innerHTML='<div class="status"><b>No direct results were returned.</b><p><a href="https://duckduckgo.com/?q='+encodeURIComponent(query)+'" target="_blank" rel="noopener noreferrer">Continue searching on DuckDuckGo →</a></p></div>'}else{const more=document.createElement('div');more.className='more';more.innerHTML='<a href="https://duckduckgo.com/?q='+encodeURIComponent(query)+'" target="_blank" rel="noopener noreferrer">See more DuckDuckGo results →</a>';out.appendChild(more)}}catch(e){console.error(e);out.innerHTML='<div class="status"><b>Jref search is temporarily unavailable.</b><p>'+esc(e.message)+'</p><button onclick="run()">Try again</button></div>'}}run();
</script></body></html>
