<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>JREF AI Search</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b0b0b;
  color: white;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* AI BOX */
.aiBox {
  padding: 12px;
  background: #121826;
  border-bottom: 1px solid #3b82f6;
  box-shadow: 0 0 15px #3b82f6;
  flex-shrink: 0;
}

/* HEADER */
header {
  display: flex;
  gap: 10px;
  padding: 10px;
  flex-shrink: 0;
}

header input {
  flex: 1;
  padding: 10px;
  border-radius: 20px;
  border: none;
  outline: none;
}

header button {
  padding: 10px 14px;
  border-radius: 20px;
  border: none;
  background: #3b82f6;
  color: white;
  cursor: pointer;
}

/* MAIN */
.container {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* RESULTS */
.left {
  width: 40%;
  overflow-y: auto;
  padding: 10px;
}

/* EMBED */
.right {
  width: 60%;
  background: black;
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
}

/* RESULT BUTTON */
.result {
  width: 100%;
  background: #151515;
  margin: 10px 0;
  padding: 12px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.2s;
  border: 1px solid #222;
  text-align: left;
  color: white;
}

.result:hover {
  background: #222;
  transform: scale(1.01);
  border-color: #3b82f6;
}

.title {
  font-weight: bold;
  font-size: 14px;
}

.desc {
  font-size: 12px;
  opacity: 0.7;
  margin-top: 4px;
}

.link {
  font-size: 11px;
  color: #60a5fa;
  margin-top: 6px;
  opacity: 0.9;
}
</style>
</head>

<body>

<!-- AI BOX -->
<div class="aiBox" id="aiBox">
  JREF AI is ready to help you search.
</div>

<!-- SEARCH -->
<header>
  <input id="searchBox" placeholder="Search JREF AI...">
  <button onclick="runSearch()">Search</button>
  <button onclick="goCom()">.com</button>
</header>

<!-- MAIN -->
<div class="container">

  <div class="left" id="results"></div>

  <div class="right">
    <iframe id="viewer" src="https://jref-ai.vercel.app/"></iframe>
  </div>

</div>

<script>
const params = new URLSearchParams(location.search);
const query = params.get("q") || "";

const searchBox = document.getElementById("searchBox");
const resultsDiv = document.getElementById("results");
const aiBox = document.getElementById("aiBox");
const viewer = document.getElementById("viewer");

searchBox.value = query;

/* AI BOX */
function aiThink(q) {
  aiBox.innerHTML = `
    <b>JREF AI</b><br>
    Searching for: "<b>${q}</b>"<br>
    Generating web results + suggestions...
  `;
}

/* EMBED VIEW */
function openSite(url) {
  viewer.src = url;
}

/* RESULT AS BUTTON */
function addResult(title, desc, url) {
  const btn = document.createElement("button");
  btn.className = "result";

  btn.innerHTML = `
    <div class="title">${title}</div>
    <div class="desc">${desc || ""}</div>
    <div class="link">${url}</div>
  `;

  btn.onclick = () => openSite(url);

  resultsDiv.appendChild(btn);
}

/* DOMAIN SYSTEM */
function makeDomains(q) {
  const clean = q.toLowerCase().replace(/[^a-z0-9]/g, "");

  return [
    clean + ".com",
    clean + ".org",
    clean + ".fun",
    clean + ".ink"
  ];
}

/* SEARCH ENGINE */
async function run(query) {
  aiThink(query);
  resultsDiv.innerHTML = "";

  // AI RESULT
  addResult(
    "🧠 JREF AI Search",
    "AI-enhanced search view",
    "https://jref-ai.vercel.app/?q=" + encodeURIComponent(query)
  );

  // DUCKDUCKGO
  try {
    const res = await fetch(
      `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`
    );

    const data = await res.json();

    if (data.Heading || data.AbstractURL) {
      addResult(
        data.Heading || query,
        data.AbstractText || "Instant answer",
        data.AbstractURL || "https://duckduckgo.com/?q=" + encodeURIComponent(query)
      );
    }

    if (data.RelatedTopics) {
      data.RelatedTopics.slice(0, 6).forEach(t => {
        if (t.FirstURL) {
          addResult(
            t.Text?.split(" - ")[0] || "Result",
            t.Text || "",
            t.FirstURL
          );
        }
      });
    }
  } catch (e) {
    console.log("DuckDuckGo failed");
  }

  // DOMAIN SUGGESTIONS
  makeDomains(query).forEach(d => {
    addResult(
      "🌐 " + d,
      "Generated domain suggestion",
      "https://" + d
    );
  });
}

/* BUTTONS */
function runSearch() {
  const q = searchBox.value.trim();
  location.href = "?q=" + encodeURIComponent(q);
}

function goCom() {
  const q = searchBox.value.trim();
  if (!q) return;
  location.href = "https://" + q.replace(/\s+/g, "").toLowerCase() + ".com";
}

searchBox.addEventListener("keydown", e => {
  if (e.key === "Enter") runSearch();
});

/* INIT */
run(query);
</script>

</body>
</html>
