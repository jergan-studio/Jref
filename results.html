<!DOCTYPE html>
<html>
<head>
<title>Jref Results</title>

<style>
body{
  font-family:Arial;
  padding:20px;
}

.result{
  padding:10px;
  margin:10px 0;
  border:1px solid #ddd;
  border-radius:10px;
}
</style>
</head>

<body>

<h1>Results</h1>

<div id="out"></div>

<script>

const q = new URLSearchParams(location.search).get("q") || "";

/* LOAD DB */
let db = JSON.parse(localStorage.getItem("jref_db") || "{}");

let out = document.getElementById("out");

out.innerHTML = `<p>Searching: <b>${q}</b></p>`;

/* SIMILARITY SEARCH */
function similarity(a,b){
  a=a.toLowerCase();
  b=b.toLowerCase();

  let score=0;

  if(a.includes(b)) score+=3;
  if(b.includes(a)) score+=3;

  let aWords=a.split(" ");
  let bWords=b.split(" ");

  aWords.forEach(w=>{
    if(bWords.includes(w)) score++;
  });

  return score;
}

let results=[];

/* FIND MATCHES */
for(let k in db){

  let score = similarity(k,q);

  if(score>0){
    results.push({k,score,url:db[k]});
  }
}

/* SORT BEST MATCH FIRST */
results.sort((a,b)=>b.score-a.score);

/* SHOW RESULTS */
if(results.length>0){

  results.forEach(r=>{
    let div=document.createElement("div");
    div.className="result";

    div.innerHTML=`
      <b>${r.k}</b><br>
      <a href="${r.url}" target="_blank">${r.url}</a><br>
      score: ${r.score}
    `;

    out.appendChild(div);
  });

}else{

  out.innerHTML+=`
    <p>No match found in database.</p>
    <a href="https://www.google.com/search?q=${encodeURIComponent(q)}">
      Search Google for "${q}"
    </a>
  `;
}

</script>

</body>
</html>
