<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JREF -Results </title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:white;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* AI BAR */
.aiBox{
  background:#121826;
  border-bottom:1px solid #3b82f6;
  padding:12px;
}

.aiTitle{color:#60a5fa;font-weight:bold;}
.aiText{font-size:13px;opacity:0.9;}

/* SEARCH */
header{
  display:flex;
  gap:10px;
  padding:12px;
  background:#0f0f0f;
  border-bottom:1px solid #1f1f1f;
}

header input{
  flex:1;
  background:#181818;
  border:none;
  outline:none;
  color:white;
  padding:12px 16px;
  border-radius:999px;
}

header button{
  background:#3b82f6;
  border:none;
  color:white;
  border-radius:999px;
  padding:0 16px;
}

/* MAIN */
.container{
  flex:1;
  display:flex;
  overflow:hidden;
}

.left{
  width:40%;
  overflow-y:auto;
  padding:10px;
  border-right:1px solid #1f1f1f;
}

.right{
  width:60%;
  background:black;
}

iframe{
  width:100%;
  height:100%;
  border:none;
}

/* RESULTS */
.result{
  width:100%;
  display:block;
  background:#151515;
  border:1px solid #222;
  border-radius:14px;
  padding:14px;
  margin-bottom:10px;
  text-align:left;
  color:white;
  cursor:pointer;
}

.result:hover{
  background:#202020;
  border-color:#3b82f6;
}

.title{font-weight:bold;}
.desc{font-size:12px;opacity:0.7;margin-top:5px;}
.link{font-size:11px;color:#60a5fa;margin-top:8px;word-break:break-all;}
</style>
</head>

<body>

<div class="aiBox">
  <div class="aiTitle">🧠 JREF AI</div>
  <div class="aiText" id="aiText">Ready...</div>
</div>

<header>
  <input id="searchBox" placeholder="Search JREF...">
</header>

<div class="container">
  <div class="left" id="results"></div>
  <div class="right">
    <iframe id="viewer" src="https://jref-ai.vercel.app/"></iframe>
  </div>
</div>

<script>
const searchBox = document.getElementById("searchBox");
const resultsDiv = document.getElementById("results");
const viewer = document.getElementById("viewer");
const aiText = document.getElementById("aiText");

let timeout;

/* READ URL QUERY (FIX #1) */
const params = new URLSearchParams(location.search);
const initialQuery = params.get("q") || "";

/* AI TEXT */
function updateAI(q){
  aiText.innerHTML = q ? `Searching: <b>${q}</b>` : "Ready...";
}

/* OPEN IN SAME TAB (IFRAME) */
function openSite(url){
  viewer.src = url;
}

/* RESULT BUILDER */
function addResult(title, desc, url){

  const btn = document.createElement("button");
  btn.className = "result";

  btn.innerHTML = `
    <div class="title">${title}</div>
    <div class="desc">${desc || ""}</div>
    <div class="link">${url}</div>
  `;

  btn.onclick = () => openSite(url);

  resultsDiv.appendChild(btn);
}

/* SEARCH ENGINE */
async function runSearch(q){

  resultsDiv.innerHTML = "";
  if(!q) return;

  updateAI(q);

  addResult("🧠 JREF AI","Preview","https://jref-ai.vercel.app/?q="+encodeURIComponent(q));

  addResult("🔎 Google","Search","https://www.google.com/search?q="+encodeURIComponent(q));
  addResult("🅱️ Bing","Search","https://www.bing.com/search?q="+encodeURIComponent(q));
  addResult("🦆 DuckDuckGo","Search","https://duckduckgo.com/?q="+encodeURIComponent(q));

  addResult("🎓 "+q+".mit.edu","Generated","https://"+q.replace(/\s+/g,"").toLowerCase()+".mit.edu");
  addResult("▲ "+q+".vercel.app","Generated","https://"+q.replace(/\s+/g,"").toLowerCase()+".vercel.app");

}

/* INSTANT SEARCH */
searchBox.addEventListener("input", () => {
  clearTimeout(timeout);
  const q = searchBox.value.trim();

  timeout = setTimeout(() => runSearch(q), 200);
});

/* ENTER */
searchBox.addEventListener("keydown", e => {
  if(e.key === "Enter") runSearch(searchBox.value.trim());
});

/* FIX #2: AUTO RUN FROM URL */
searchBox.value = initialQuery;
if(initialQuery){
  runSearch(initialQuery);
}
</script>

</body>
</html>
