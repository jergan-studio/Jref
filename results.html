<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jref Results</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#fff;color:#111}
header{display:flex;align-items:center;gap:15px;padding:14px 20px;border-bottom:1px solid #ddd;position:sticky;top:0;background:#fff;z-index:2}
h1{font-size:28px;margin:0}
.search{flex:1;max-width:700px;padding:12px 16px;border:1px solid #ddd;border-radius:22px}
button{padding:10px 15px;border:0;border-radius:10px;background:#e6c3d3;cursor:pointer}
#account{margin-left:auto}
#searchFrame{display:block;width:calc(100% - 30px);height:calc(100vh - 90px);margin:15px;border:0;border-radius:10px}
#fallback{display:none;margin:25px;padding:20px;border:1px solid #ddd;border-radius:10px}
</style>
</head>
<body>
<header>
<h1>Jref</h1>
<input id="search" class="search" placeholder="Search with DuckDuckGo..." autocomplete="off">
<button onclick="search()">Search</button>
<button id="account" onclick="jerganLogin()">🔐 Jergan</button>
</header>
<iframe id="searchFrame" title="DuckDuckGo HTML Search" sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"></iframe>
<div id="fallback"><b>DuckDuckGo could not be embedded in this browser.</b><p><a id="duckLink" target="_blank" rel="noopener noreferrer">Open DuckDuckGo results</a></p></div>
<script>
const query=new URLSearchParams(location.search).get('q')||'';
const searchBox=document.getElementById('search');
const frame=document.getElementById('searchFrame');
const fallback=document.getElementById('fallback');
searchBox.value=query;
function duckUrl(q){return 'https://html.duckduckgo.com/html/?q='+encodeURIComponent(q)}
function search(){const q=searchBox.value.trim();if(q)location.href='results.html?q='+encodeURIComponent(q)}
searchBox.addEventListener('keydown',e=>{if(e.key==='Enter')search()});
function jerganLogin(){const returnTo=encodeURIComponent('https://jref-theta.vercel.app/home.html');location.href='https://jerganstudio.vercel.app/signin.html?site=jref&return_to='+returnTo}
if(query){frame.src=duckUrl(query);document.getElementById('duckLink').href=duckUrl(query)}else{frame.style.display='none';fallback.style.display='block';document.getElementById('duckLink').href=duckUrl('')}
frame.addEventListener('error',()=>{frame.style.display='none';fallback.style.display='block'});
</script>
</body>
</html>
