<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>JREF AI Search</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b0b0b;
  color: white;
}

/* TOP AI BOX (like Gemini) */
.aiBox {
  margin: 15px;
  padding: 15px;
  border-radius: 12px;
  background: #121826;
  border: 1px solid #3b82f6;
  box-shadow: 0 0 20px #3b82f6;
}

/* SEARCH BAR */
header {
  display: flex;
  gap: 10px;
  padding: 10px 15px;
}

header input {
  flex: 1;
  padding: 12px;
  border-radius: 20px;
  border: none;
  outline: none;
}

header button {
  padding: 12px 16px;
  border-radius: 20px;
  border: none;
  background: #3b82f6;
  color: white;
  cursor: pointer;
}

/* MAIN LAYOUT */
.container {
  display: flex;
  height: calc(100vh - 140px);
}

/* RESULTS */
.left {
  width: 40%;
  overflow-y: auto;
  padding: 10px;
}

.result {
  background: #151515;
  margin: 10px 0;
  padding: 12px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.2s;
}

.result:hover {
  background: #222;
}

.result a {
  color: #60a5fa;
  text-decoration: none;
}

/* EMBED */
.right {
  width: 60%;
  background: #000;
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
}
</style>
</head>

<body>

<!-- AI BOX (like Gemini) -->
<div class="aiBox" id="aiBox">
  JREF AI is ready.
</div>

<header>
  <input id="searchBox" placeholder="Search JREF AI...">
  <button onclick="goSearch()">Search</button>
  <button onclick="goCom()">.com</button>
</header>

<div class="container">

  <div class="left" id="results"></div>

  <div class="right">
    <iframe id="viewer" src="https://jref-ai.vercel.app/"></iframe>
  </div>

</div>

<script>
const params = new URLSearchParams(location.search);
const query = params.get("q") || "";

const searchBox = document.getElementById("searchBox");
const resultsDiv = document.getElementById("results");
const aiBox = document.getElementById("aiBox");
const viewer = document.getElementById("viewer");

searchBox.value = query;

/* ---------------- AI TOP BOX ---------------- */
function aiThink(q) {
  aiBox.innerHTML = `
    <b>JREF AI:</b><br>
    You searched "<b>${q}</b>".<br>
    I found web results, instant answers, and possible domains.
  `;
}

/* ---------------- LINK SYSTEM (.com etc) ---------------- */
function makeDomains(q) {
  const clean = q.toLowerCase().replace(/[^a-z0-9]/g, "");

  return [
    clean + ".com",
    clean + ".org",
    clean + ".fun",
    clean + ".ink"
  ];
}

/* ---------------- RESULT CLICK ---------------- */
function openSite(url) {
  viewer.src = url;
}

/* ---------------- RENDER RESULT ---------------- */
function addResult(title, desc, url) {
  const div = document.createElement("div");
  div.className = "result";

  div.innerHTML = `
    <b>${title}</b><br>
    <small>${desc || ""}</small><br>
    <a href="#">${url}</a>
  `;

  div.onclick = () => openSite(url);

  resultsDiv.appendChild(div);
}

/* ---------------- SEARCH ---------------- */
async function run(q) {
  aiThink(q);

  resultsDiv.innerHTML = "";

  /* 1. JREF AI result */
  addResult(
    "JREF AI Answer",
    "AI-powered search view",
    "https://jref-ai.vercel.app/?q=" + encodeURIComponent(q)
  );

  /* 2. DuckDuckGo API (REAL VORD VOID METHOD) */
  try {
    const res = await fetch(
      `https://api.duckduckgo.com/?q=${encodeURIComponent(q)}&format=json&no_html=1`
    );

    const data = await res.json();

    if (data.Heading || data.AbstractURL) {
      addResult(
        data.Heading || q,
        data.AbstractText || "Instant answer",
        data.AbstractURL || "https://duckduckgo.com/?q=" + encodeURIComponent(q)
      );
    }

    if (data.RelatedTopics) {
      data.RelatedTopics.slice(0, 5).forEach(t => {
        if (t.FirstURL) {
          addResult(
            t.Text?.split(" - ")[0] || "Result",
            t.Text || "",
            t.FirstURL
          );
        }
      });
    }
  } catch (e) {
    console.log("DDG failed");
  }

  /* 3. .COM SYSTEM (your feature) */
  makeDomains(q).forEach(d => {
    addResult(
      "🌐 " + d,
      "Generated domain suggestion",
      "https://" + d
    );
  });
}

/* ---------------- EVENTS ---------------- */
function goSearch() {
  const q = searchBox.value.trim();
  location.href = "?q=" + encodeURIComponent(q);
}

function goCom() {
  const q = searchBox.value.trim();
  if (!q) return;
  location.href = "https://" + q.replace(/\s+/g, "").toLowerCase() + ".com";
}

searchBox.addEventListener("keydown", e => {
  if (e.key === "Enter") goSearch();
});

run(query);
</script>

</body>
</html>
