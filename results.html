<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JREF Instant Search</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0b0b0b;
  color:white;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* TOP AI BAR */
.aiBox{
  background:#121826;
  border-bottom:1px solid #3b82f6;
  padding:12px;
  box-shadow:0 0 15px rgba(59,130,246,0.5);
  z-index:10;
}

.aiTitle{
  font-weight:bold;
  color:#60a5fa;
  margin-bottom:4px;
}

.aiText{
  font-size:13px;
  opacity:0.9;
}

/* SEARCH HEADER */
header{
  display:flex;
  gap:10px;
  padding:12px;
  background:#0f0f0f;
  border-bottom:1px solid #1f1f1f;
}

header input{
  flex:1;
  background:#181818;
  color:white;
  border:none;
  outline:none;
  padding:12px 16px;
  border-radius:999px;
  font-size:15px;
}

header button{
  background:#3b82f6;
  color:white;
  border:none;
  border-radius:999px;
  padding:0 18px;
  cursor:pointer;
  transition:0.2s;
}

header button:hover{
  background:#2563eb;
}

/* MAIN */
.container{
  flex:1;
  display:flex;
  overflow:hidden;
}

/* LEFT RESULTS */
.left{
  width:40%;
  overflow-y:auto;
  border-right:1px solid #1f1f1f;
  padding:10px;
}

/* RIGHT VIEWER */
.right{
  width:60%;
  background:black;
}

iframe{
  width:100%;
  height:100%;
  border:none;
}

/* RESULT BUTTONS */
.result{
  width:100%;
  background:#151515;
  border:1px solid #222;
  color:white;
  border-radius:14px;
  padding:14px;
  margin-bottom:10px;
  text-align:left;
  cursor:pointer;
  transition:0.2s;
}

.result:hover{
  background:#202020;
  border-color:#3b82f6;
  transform:scale(1.01);
}

.resultTitle{
  font-size:15px;
  font-weight:bold;
  margin-bottom:5px;
}

.resultDesc{
  font-size:12px;
  opacity:0.7;
  line-height:1.4;
}

.resultLink{
  margin-top:8px;
  font-size:11px;
  color:#60a5fa;
  word-break:break-all;
}

/* LOADING */
.loading{
  opacity:0.7;
  padding:10px;
  font-size:13px;
}

/* SCROLLBAR */
::-webkit-scrollbar{
  width:8px;
}

::-webkit-scrollbar-thumb{
  background:#222;
  border-radius:999px;
}
</style>
</head>

<body>

<!-- AI TOP -->
<div class="aiBox">
  <div class="aiTitle">🧠 JREF AI</div>
  <div class="aiText" id="aiText">
    Ready for instant search...
  </div>
</div>

<!-- SEARCH -->
<header>
  <input 
    type="text" 
    id="searchBox"
    placeholder="Search JREF instantly..."
    autocomplete="off"
  >

  <button onclick="openCom()">.com</button>
</header>

<!-- MAIN -->
<div class="container">

  <!-- RESULTS -->
  <div class="left" id="results"></div>

  <!-- PREVIEW -->
  <div class="right">
    <iframe id="viewer" src="https://jref-ai.vercel.app/"></iframe>
  </div>

</div>

<script>
const searchBox = document.getElementById("searchBox");
const resultsDiv = document.getElementById("results");
const viewer = document.getElementById("viewer");
const aiText = document.getElementById("aiText");

let searchTimeout;

/* OPEN WEBSITE */
function openSite(url){
  viewer.src = url;
}

/* AI TEXT */
function updateAI(query){
  if(!query){
    aiText.innerHTML = "Ready for instant search...";
    return;
  }

  aiText.innerHTML = `
    Searching instantly for:
    <b>${query}</b>
  `;
}

/* RESULT CREATOR */
function addResult(title, desc, url){
  const btn = document.createElement("button");

  btn.className = "result";

  btn.innerHTML = `
    <div class="resultTitle">${title}</div>
    <div class="resultDesc">${desc || "No description available."}</div>
    <div class="resultLink">${url}</div>
  `;

  btn.onclick = () => {
    openSite(url);
  };

  resultsDiv.appendChild(btn);
}

/* DOMAIN SUGGESTIONS */
function makeDomains(q){
  const clean = q.toLowerCase().replace(/[^a-z0-9]/g, "");

  return [
    clean + ".com",
    clean + ".org",
    clean + ".net",
    clean + ".ai",
    clean + ".fun"
  ];
}

/* SEARCH ENGINE */
async function runSearch(query){

  resultsDiv.innerHTML = "";

  if(!query){
    return;
  }

  updateAI(query);

  /* LOADING */
  resultsDiv.innerHTML = `
    <div class="loading">
      Loading instant results...
    </div>
  `;

  /* CLEAR */
  setTimeout(() => {
    resultsDiv.innerHTML = "";
  }, 100);

  /* AI RESULT */
  addResult(
    "🧠 JREF AI",
    "AI enhanced search result",
    "https://jref-ai.vercel.app/?q=" + encodeURIComponent(query)
  );

  /* GOOGLE STYLE QUICK SEARCH */
  addResult(
    "🔎 Search on DuckDuckGo",
    "Open external search engine",
    "https://duckduckgo.com/?q=" + encodeURIComponent(query)
  );

  /* DUCKDUCKGO API */
  try{

    const res = await fetch(
      `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`
    );

    const data = await res.json();

    if(data.AbstractURL){

      addResult(
        data.Heading || query,
        data.AbstractText || "Instant answer",
        data.AbstractURL
      );

    }

    if(data.RelatedTopics){

      data.RelatedTopics.slice(0,8).forEach(item => {

        if(item.FirstURL){

          addResult(
            item.Text?.split(" - ")[0] || "Result",
            item.Text || "Search result",
            item.FirstURL
          );

        }

      });

    }

  }catch(err){

    console.log("Search failed");

  }

  /* DOMAIN RESULTS */
  makeDomains(query).forEach(domain => {

    addResult(
      "🌐 " + domain,
      "Generated domain suggestion",
      "https://" + domain
    );

  });

}

/* INSTANT SEARCH */
searchBox.addEventListener("input", () => {

  clearTimeout(searchTimeout);

  const query = searchBox.value.trim();

  searchTimeout = setTimeout(() => {

    runSearch(query);

  }, 250);

});

/* ENTER KEY */
searchBox.addEventListener("keydown", e => {

  if(e.key === "Enter"){

    runSearch(searchBox.value.trim());

  }

});

/* .COM BUTTON */
function openCom(){

  const q = searchBox.value.trim();

  if(!q) return;

  openSite(
    "https://" +
    q.replace(/\s+/g,"").toLowerCase() +
    ".com"
  );

}
</script>

</body>
</html>
