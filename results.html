<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>JREF Results</title>

<style>
body {
  margin: 0;
  background: radial-gradient(circle at top, #111, #000);
  color: white;
  font-family: Arial;
}

header {
  padding: 15px;
  display: flex;
  gap: 10px;
  border-bottom: 1px solid #222;
}

header input {
  flex: 1;
  padding: 12px;
  border-radius: 20px;
  border: none;
}

header button {
  padding: 12px 16px;
  border-radius: 20px;
  border: none;
  background: #4f7cff;
  color: white;
  cursor: pointer;
}

.ai {
  margin: 20px;
  padding: 15px;
  border: 1px solid #4f7cff;
  box-shadow: 0 0 20px #4f7cff;
}

.result {
  margin: 15px 20px;
  padding: 15px;
  background: #141414;
  border-radius: 10px;
  cursor: pointer;
}

.result:hover {
  background: #1f1f1f;
}

a {
  color: #4f7cff;
  text-decoration: none;
}
</style>
</head>

<body>

<header>
  <input id="searchBox" placeholder="Search JREF...">
  <button onclick="goCom()">.com</button>
</header>

<div class="ai" id="ai"></div>
<div id="results"></div>

<script>
const params = new URLSearchParams(location.search);
const query = params.get("q") || "";

const searchBox = document.getElementById("searchBox");
const resultsDiv = document.getElementById("results");
const ai = document.getElementById("ai");

searchBox.value = query;

function aiThink() {
  ai.textContent =
    `JREF AI: Searching for "${query}" — showing instant web knowledge + suggestions.`;
}

function addResult(title, desc, url) {
  const div = document.createElement("div");
  div.className = "result";

  div.innerHTML = `
    <b>${title}</b><br>
    <small>${desc}</small><br>
    <a href="${url}" target="_blank">${url}</a>
  `;

  div.onclick = () => {
    window.location.href = url; // NOT new tab
  };

  resultsDiv.appendChild(div);
}

function goCom() {
  const q = searchBox.value.trim();
  if (!q) return;

  window.location.href = "https://" + q.replace(/\s+/g, "").toLowerCase() + ".com";
}

searchBox.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    location.href = "results.html?q=" + encodeURIComponent(searchBox.value);
  }
});

async function run() {
  aiThink();

  const res = await fetch(
    `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`
  );

  const data = await res.json();

  // Instant answer
  if (data.Heading || data.AbstractText) {
    addResult(
      data.Heading || query,
      data.AbstractText || "Instant answer from DuckDuckGo",
      data.AbstractURL || "https://duckduckgo.com/?q=" + encodeURIComponent(query)
    );
  }

  // Related topics
  if (data.RelatedTopics) {
    data.RelatedTopics.slice(0, 6).forEach(t => {
      if (t.FirstURL) {
        addResult(
          t.Text?.split(" - ")[0] || "Result",
          t.Text || "",
          t.FirstURL
        );
      }
    });
  }

  // fallback if empty
  if (!data.Heading && (!data.RelatedTopics || data.RelatedTopics.length === 0)) {
    addResult(
      "Search Web",
      "No instant results found — open full search page",
      "https://duckduckgo.com/?q=" + encodeURIComponent(query)
    );
  }
}

run();
</script>

</body>
</html>
