<!DOCTYPE html>
<html>
<head>
<title>JREF Results</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #e9e9e9;
}

/* layout */
.container {
  display: flex;
  height: 100vh;
}

/* left results */
.left {
  width: 40%;
  overflow-y: auto;
  padding: 15px;
  background: #f5f5f5;
}

/* right embed */
.right {
  width: 60%;
  background: #111;
}

/* iframe */
iframe {
  width: 100%;
  height: 100%;
  border: none;
  background: white;
}

/* result cards */
.result {
  background: white;
  margin: 10px 0;
  padding: 12px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.2s;
}

.result:hover {
  transform: scale(1.02);
}

/* title */
h3 {
  margin-top: 0;
}
</style>
</head>

<body>

<div class="container">

  <!-- LEFT SIDE -->
  <div class="left">
    <h3 id="title">Results</h3>
    <div id="results">Loading...</div>
  </div>

  <!-- RIGHT SIDE (EMBED VIEWER) -->
  <div class="right">
    <iframe id="viewer" src="https://jref-ai.vercel.app/"></iframe>
  </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const query = params.get("q") || "";

document.getElementById("title").innerText = "Results for: " + query;

const box = document.getElementById("results");
const viewer = document.getElementById("viewer");

/* -----------------------------
   OPEN IN EMBED VIEWER
------------------------------ */
function openSite(url) {
  viewer.src = url;
}

/* -----------------------------
   REAL SEARCH FIX
   DuckDuckGo HTML scraping
------------------------------ */

fetch("https://duckduckgo.com/html/?q=" + encodeURIComponent(query))
  .then(res => res.text())
  .then(html => {

    const parser = new DOMParser();
    const doc = parser.parseFromString(html, "text/html");

    const results = doc.querySelectorAll(".result__a");

    box.innerHTML = "";

    if (results.length === 0) {
      box.innerHTML = "<p>No results found.</p>";
      return;
    }

    results.forEach(link => {
      const div = document.createElement("div");
      div.className = "result";

      div.innerText = link.innerText;

      div.onclick = () => openSite(link.href);

      box.appendChild(div);
    });

  })
  .catch(err => {
    box.innerHTML = "<p>Error loading results.</p>";
    console.error(err);
  });

</script>

</body>
</html>
