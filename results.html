<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jref Results</title>
<style>
body{margin:0;background:radial-gradient(circle at top,#12002a,#000);color:#aee7ff;font-family:Arial,sans-serif}header{padding:15px;border-bottom:1px solid #222;display:flex;gap:10px;flex-wrap:wrap}header input{flex:1;padding:12px;border-radius:20px;border:none;min-width:180px}button{padding:12px 18px;border-radius:20px;border:none;background:#5a7cff;color:white;cursor:pointer}.ai{margin:20px;padding:15px;border:2px solid #5a7cff;box-shadow:0 0 25px #5a7cff}.result{margin:15px 20px;padding:15px;background:#141730;border-radius:10px;cursor:pointer;position:relative}.result:hover{background:#1c214a}.result img{width:16px;height:16px;vertical-align:middle;margin-right:6px}.preview{display:none;position:absolute;right:15px;top:15px;width:260px;background:#000;border:1px solid #5a7cff;padding:10px;z-index:10}.result:hover .preview{display:block}.preview iframe{width:100%;height:140px;border:none;background:#000}.preview p{font-size:.8rem;opacity:.7}.status{margin:30px 20px;padding:20px}.source{opacity:.7;font-size:.85rem}a{color:#8fcfff}
</style></head>
<body>
<header><input id="searchBox" placeholder="Search the web..."><button id="searchBtn">Search</button><button id="comBtn">Go to .com</button><button id="googleBtn">Google</button><button id="accountBtn">🔐 Jergan</button></header>
<div class="ai" id="ai"></div><div id="results"></div>
<script>
const params=new URLSearchParams(location.search),query=params.get('q')||'';const searchBox=document.getElementById('searchBox'),resultsDiv=document.getElementById('results');searchBox.value=query;
function aiThink(){document.getElementById('ai').textContent=`Jref THINKS: "${query}" may lead you to websites, tools, or references related to this topic.`}
function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}
function addResult(title,desc,url){try{new URL(url)}catch{return}const domain=new URL(url).origin,div=document.createElement('div');div.className='result';div.innerHTML=`<h3><img src="${esc(domain+'/favicon.ico')}" onerror="this.style.display='none'">${esc(title)}</h3><p>${esc(desc)}</p><div class="preview"><iframe src="${esc(url)}" loading="lazy"></iframe><p>Preview (if allowed)</p></div>`;div.onclick=()=>window.open(url,'_blank','noopener,noreferrer');resultsDiv.appendChild(div)}
function doSearch(){const q=searchBox.value.trim();if(q)location.href='results.html?q='+encodeURIComponent(q)}
document.getElementById('searchBtn').onclick=doSearch;searchBox.addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});
document.getElementById('comBtn').onclick=()=>{const q=searchBox.value.trim();if(!q)return alert('Enter a search first!');window.open('https://'+q.replace(/\s+/g,'').toLowerCase()+'.com','_blank','noopener,noreferrer')};
document.getElementById('googleBtn').onclick=()=>{const q=searchBox.value.trim()||query;if(q)window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank','noopener,noreferrer')};
document.getElementById('accountBtn').onclick=()=>{location.href='https://jerganstudio.vercel.app/signin.html?site=jref&return_to='+encodeURIComponent(location.href)};
async function run(){aiThink();if(!query){resultsDiv.innerHTML='<div class="status">Enter a search first.</div>';return}resultsDiv.innerHTML='<div class="status">Searching DuckDuckGo...</div>';try{const res=await fetch('https://api.duckduckgo.com/?q='+encodeURIComponent(query)+'&format=json&no_html=1&skip_disambig=1',{headers:{Accept:'application/json'}});if(!res.ok)throw new Error('DuckDuckGo returned HTTP '+res.status);const data=await res.json();resultsDiv.innerHTML='';let count=0;if(data.AbstractURL){addResult(data.Heading||query,data.AbstractText||'Instant answer',data.AbstractURL);count++}const topics=Array.isArray(data.RelatedTopics)?data.RelatedTopics:[];function addTopic(t){if(t&&t.FirstURL){addResult((t.Text||'Result').split(' - ')[0],t.Text||'',t.FirstURL);count++}if(t&&Array.isArray(t.Topics))t.Topics.forEach(addTopic)}topics.forEach(addTopic);if(!count)resultsDiv.innerHTML=`<div class="status"><b>No DuckDuckGo instant results were returned.</b><p><a href="https://duckduckgo.com/?q=${encodeURIComponent(query)}" target="_blank" rel="noopener noreferrer">Open full DuckDuckGo results →</a></p></div>`}catch(e){console.error(e);resultsDiv.innerHTML=`<div class="status"><b>Jref could not reach DuckDuckGo.</b><p>${esc(e.message)}</p><p>Try again or use Google.</p><button onclick="run()">Try again</button></div>`}}run();
</script></body></html>
