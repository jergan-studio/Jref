<!DOCTYPE html>
<html>
<head>
<title>JREF Results</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #e9e9e9;
}

.container {
  display: flex;
  height: 100vh;
}

/* LEFT PANEL */
.left {
  width: 40%;
  overflow-y: auto;
  padding: 15px;
  background: #f5f5f5;
}

/* RIGHT PANEL */
.right {
  width: 60%;
  background: #111;
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
  background: white;
}

/* RESULT CARD */
.result {
  background: white;
  margin: 10px 0;
  padding: 12px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.2s;
}

.result:hover {
  transform: scale(1.02);
}

a {
  color: #2563eb;
  text-decoration: none;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

  <div class="left">
    <h3 id="title"></h3>
    <div id="results">Loading...</div>
  </div>

  <div class="right">
    <iframe id="viewer" src="https://jref-ai.vercel.app/"></iframe>
  </div>

</div>

<script>
const query = new URLSearchParams(window.location.search).get("q") || "";

document.getElementById("title").innerText = "Results for: " + query;

const box = document.getElementById("results");
const viewer = document.getElementById("viewer");

function openSite(url) {
  viewer.src = url;
}

/* -----------------------------
   URL GUESS SYSTEM (.com etc)
------------------------------ */
function makeGuessLinks(q) {
  const clean = q.toLowerCase().replace(/[^a-z0-9]/g, "");

  return [
    { title: clean + ".com", url: "https://" + clean + ".com" },
    { title: clean + ".org", url: "https://" + clean + ".org" },
    { title: clean + ".fun", url: "https://" + clean + ".fun" },
    { title: clean + ".ink", url: "https://" + clean + ".ink" }
  ];
}

/* -----------------------------
   DUCKDUCKGO LITE SEARCH
   (THIS IS THE FIX THAT WORKS)
------------------------------ */

fetch("https://duckduckgo.com/lite/?q=" + encodeURIComponent(query))
  .then(res => res.text())
  .then(html => {

    const doc = new DOMParser().parseFromString(html, "text/html");

    const links = doc.querySelectorAll("a.result-link");

    box.innerHTML = "";

    /* 1. AI-style JREF link */
    const jref = document.createElement("div");
    jref.className = "result";
    jref.innerHTML = `<a href="#">🔎 Search in JREF AI</a>`;
    jref.onclick = () => openSite("https://jref-ai.vercel.app/?q=" + encodeURIComponent(query));
    box.appendChild(jref);

    /* 2. DuckDuckGo results */
    links.forEach(link => {
      const div = document.createElement("div");
      div.className = "result";

      div.innerHTML = `<a href="${link.href}">${link.innerText}</a>`;

      div.onclick = () => openSite(link.href);

      box.appendChild(div);
    });

    /* 3. URL GUESS RESULTS */
    const guesses = makeGuessLinks(query);

    guesses.forEach(g => {
      const div = document.createElement("div");
      div.className = "result";

      div.innerHTML = `<a href="${g.url}">🌐 ${g.title}</a>`;

      div.onclick = () => openSite(g.url);

      box.appendChild(div);
    });

  })
  .catch(err => {
    box.innerHTML = "<p>Error loading results.</p>";
    console.error(err);
  });

</script>

</body>
</html>
